function sendChat(id){
 const n=partnerById(id),input=document.getElementById("chatInput");if(!n||!input)return;const text=input.value.trim();if(!text)return;
 n.chat=n.chat||[];n.chat.push({from:"You",text,day:`${S.world.day}/${S.world.month}/${S.world.year}`});
 const affectionGain=text.length>80?3:2;n.affection=Math.min(100,n.affection+affectionGain);n.trust=Math.min(100,n.trust+(text.length>40?2:1));
 if(/cewek|perempuan|date|selingkuh/.test(text.toLowerCase()))n.jealousy=Math.min(100,n.jealousy+1);
 const reply=chatContext(n,text);n.chat.push({from:n.name,text:reply,day:`${S.world.day}/${S.world.month}/${S.world.year}`});save();render();setTimeout(()=>openChat(id),20)
}

let S=load(); 
function load(){
 try{
  const raw4=localStorage.getItem(KEY);
  if(raw4){
   const x=JSON.parse(raw4);
   if(x&&(x.version===5||x.version===4))return normalizeState({...x,version:5});
  }
  const old4=localStorage.getItem(OLD_KEY);
  if(old4){const x=JSON.parse(old4);const migrated=normalizeState({...makeState(),...x,version:5});localStorage.setItem(KEY,JSON.stringify(migrated));return migrated}
  const raw3=localStorage.getItem(LEGACY_KEY);
  if(raw3){
   const x=JSON.parse(raw3);
   if(x&&x.version===3){
    const migrated=normalizeState({...makeState(),...x,version:4});
    localStorage.setItem(KEY,JSON.stringify(migrated));
    return migrated;
   }
  }
  const raw2=localStorage.getItem(LEGACY_KEY_V2);
  if(raw2){
   const x=JSON.parse(raw2);
   const migrated=migrateV2(x);
   localStorage.setItem(KEY,JSON.stringify(migrated));
   return migrated;
  }
 }catch(e){console.warn("Save migration failed:",e)}
 return makeState()
}
function normalizeState(x){
 const base=makeState();
 x.player={...base.player,...(x.player||{})};
 x.player.stats={...base.player.stats,...(x.player.stats||{})};
 x.player.inventory=Array.isArray(x.player.inventory)?x.player.inventory:[];x.player.nationality=x.player.nationality||"Indonesia";x.player.nationalTeam=x.player.nationalTeam||x.player.nationality;x.player.caps=Number(x.player.caps)||0;x.player.nationalGoals=Number(x.player.nationalGoals)||0;x.player.nationalTrophies=Number(x.player.nationalTrophies)||0;x.player.trophyRoom=Array.isArray(x.player.trophyRoom)?x.player.trophyRoom:[];x.player.jerseyNumber=Number(x.player.jerseyNumber)||9;x.player.photo=x.player.photo||"";
 x.world={...base.world,...(x.world||{})};
 x.career={...base.career,...(x.career||{})};
 x.creator={...base.creator,...(x.creator||{})};
 x.social={...base.social,...(x.social||{})};
 x.businesses=Array.isArray(x.businesses)?x.businesses:base.businesses;
 x.sponsors=Array.isArray(x.sponsors)?x.sponsors:base.sponsors;
 x.npc=Array.isArray(x.npc)?x.npc:base.npc;
 x.relations=Array.isArray(x.relations)?x.relations:[];
 x.achievements=Array.isArray(x.achievements)?x.achievements:[];x.npc=Array.isArray(x.npc)?x.npc:[];if(x.npc.length<1000){for(let i=x.npc.length;i<1000;i++)x.npc.push(npc(i))}x.family=x.family||{engagedTo:null,marriedTo:null,children:[],nextChildId:1};x.family.children=Array.isArray(x.family.children)?x.family.children:[];
 x.tab=x.tab||"home";
 return x
}
function migrateV2(x){
 const s=makeState();
 const p=x?.player||{};
 const oldStats={PAC:p.pac,SHO:p.sho,PAS:p.pas,DRI:p.dri,DEF:p.def,PHY:p.phy};
 s.player.name=[p.first,p.last].filter(Boolean).join(" ")||"Player";
 s.player.age=Number(p.age)||18;
 s.player.pos=p.pos||"ST";
 s.player.stats={...s.player.stats,...Object.fromEntries(Object.entries(oldStats).filter(([,v])=>Number.isFinite(Number(v))).map(([k,v])=>[k,Number(v)]))};
 s.player.ovr=Number(p.ovr)||66;
 s.player.money=Number(x.money)||12;
 s.player.fans=Number(x.fans)||120;
 s.player.followers=Number(x.social?.followers)||80;
 s.player.reputation=Math.max(0,Math.round((Number(x.fans)||120)/1000));
 s.player.energy=Number(x.energy)||88;
 s.player.health=Number(x.health)||96;
 s.player.morale=Number(x.morale)||80;
 s.player.form=Number(x.career?.form)||70;
 s.player.goals=Number(x.career?.goals)||0;
 s.player.assists=Number(x.career?.assists)||0;
 s.player.matches=Number(x.career?.appearances)||0;
 s.player.trophies=Number(x.career?.trophies)||0;
 s.world.year=Number(String(x.date||"2026-01-01").slice(0,4))||2026;
 s.world.month=Number(String(x.date||"2026-01-01").slice(5,7))||1;
 s.world.day=Number(String(x.date||"2026-01-01").slice(8,10))||1;
 const oldClub=x.club?.name;
 const found=clubs.find(c=>c.name===oldClub);
 if(found)s.player.clubId=found.id;
 s.social.posts=(x.social?.posts||[]).map(q=>({text:q.text||"",likes:Number(q.likes)||0,comments:Number(q.comments)||0,day:`${s.world.day}/${s.world.month}`}));
 s.achievements=Array.isArray(x.achievements)?x.achievements:[];
 s.logged=Boolean(x.setup);
 s.creator={enabled:Boolean(x.creator),slots:x.creator?10:4,email:x.email||""};
 return normalizeState(s)
}

function calcOVR(){let s=S.player.stats;let base=Math.round((s.PAC+s.SHO+s.PAS+s.DRI+s.DEF+s.PHY)/6);return Math.min(99,Math.round(base+(S.player.level-1)*1.4))}
function advanceDays(n=1){n=Math.max(1,Number(n)||1);dateAdvance(n);
 S.player.energy=Math.max(35,S.player.energy-rand(2,7));S.player.health=Math.max(50,S.player.health-rand(0,2));
 S.player.form=Math.max(30,Math.min(100,S.player.form+rand(-3,4)));
 S.player.morale=Math.max(20,Math.min(100,S.player.morale+rand(-2,3)));
 let income=0;S.businesses.forEach(b=>{income+=b.income*b.level});S.player.money=Math.max(0,S.player.money+income);
 if(Math.random()<.35) worldNews();
 if(Math.random()<.18) transferRumor();
 S.npc.forEach(n=>{n.affection=Math.max(0,n.affection+rand(-1,2));n.jealousy=Math.max(0,n.jealousy-rand(0,1));});
 save();render();
}

function addXP(x){S.player.xp+=x;let need=S.player.level*100;while(S.player.xp>=need){S.player.xp-=need;S.player.level++;S.player.potential=Math.max(S.player.potential,S.player.ovr);Object.keys(S.player.stats).forEach(k=>S.player.stats[k]+=rand(0,2));toast("LEVEL UP! 🔥");need=S.player.level*100}S.player.ovr=calcOVR()}
function train(){
 if(S.player.energy<20)return toast("Energy kurang.");
 S.player.energy-=20;S.player.form=Math.min(100,S.player.form+5);S.player.morale=Math.min(100,S.player.morale+2);addXP(35);
 const k=pick(Object.keys(S.player.stats));S.player.stats[k]=Math.min(99,S.player.stats[k]+rand(1,3));
 toast(`Training sukses: +${k}`);save();render()
}
function rest(){S.player.energy=Math.min(100,S.player.energy+35);S.player.health=Math.min(100,S.player.health+5);S.player.morale=Math.min(100,S.player.morale+3);advanceDays();toast("Recovery selesai.")}
function playMatch(){
 if(S.player.energy<30)return toast("Kamu terlalu lelah untuk main.");
 S.player.energy-=30;S.player.matches++;
 const c=club(S.player.clubId), opp=pick(clubs.filter(x=>x.id!==c.id));
 const my=(S.player.ovr+S.player.form*.15+S.career.managerTrust*.08)+(Math.random()*12-6);
 const enemy=opp.strength+(Math.random()*12-6);
 let log=[],score=0,oppScore=0,rating=6.2+Math.random()*1.2;
 for(let m=1;m<=90;m+=rand(7,14)){
   let chance=Math.random();
   if(chance<Math.max(.07,(my-enemy)/130+.10)){score++;S.player.goals++;rating+=.45;log.push(`${m}' ⚽ GOAL! ${S.player.name} finds the net.`)}
   else if(chance<.22){S.player.assists++;rating+=.15;log.push(`${m}' 🎯 Key pass creates danger.`)}
   else if(chance>.93){rating-=.25;log.push(`${m}' 🟨 Yellow card after a late challenge.`)}
   else log.push(`${m}' Game flows through midfield...`)
 }

 S.world.news.unshift({day:`${S.world.day}/${S.world.month}`,text:`${c.name} ${score}-${oppScore} ${opp.name}. ${S.player.name} rated ${pct(rating)}.`});

].map((x,i)=>({id:i+1,name:x[0],price:x[1],cat:x[2],icon:x[3]}));
function shop(){
 return headerCard()+`<div class="card"><div class="row"><div><h3>🛒 Lifestyle Shop</h3><p class="muted">Equipment, vehicles, property and flex items. Prices are in €M.</p></div><span class="tag">Balance: ${money(S.player.money)}M</span></div><hr><div class="grid">${SHOP_ITEMS.map(x=>`<div class="third card"><div class="big">${x.icon}</div><b>${x.name}</b><div class="muted">${x.cat}</div><div class="gold">${money(x.price)}M</div><button class="btn ${S.player.money>=x.price?"primary":""}" style="margin-top:8px;width:100%" onclick="buyItem(${x.id})">${S.player.money>=x.price?"Buy":"Too Expensive"}</button></div>`).join("")}</div></div>`
}
function buyItem(id){
 const x=SHOP_ITEMS.find(i=>i.id===id);if(!x)return;
 if(S.player.money<x.price)return toast("Saldo tidak cukup.");
 S.player.money-=x.price;S.player.inventory.push({name:x.name,value:x.price,icon:x.icon,cat:x.cat});
 toast(`${x.name} purchased 🛍️`);save();render()
}
function checkMilestones(){
 const checks=[
  [S.player.goals>=10,"10 Career Goals"],[S.player.assists>=10,"10 Career Assists"],
  [S.player.fans>=100000,"100K Fans"],[S.player.ovr>=80,"OVR 80 Club"],
  [netWorth()>=1000,"€1B Net Worth"],[S.businesses.some(b=>b.level>=5),"Business Level 5"]
 ];
 checks.forEach(([ok,name])=>{if(ok&&!S.achievements.includes(name))S.achievements.push(name)});
 save();toast("Milestones checked 🏆");render()
}
function partners(){
 const q=(prompt("Cari partner berdasarkan nama/job/nationality (kosong = tampilkan semua):","")||"").toLowerCase();let list=S.npc.filter(n=>!q||`${n.name} ${n.job} ${n.nationality}`.toLowerCase().includes(q)).slice(0,60);
 return headerCard()+`<div class="card"><div class="row"><div><h3>❤️ Partner Universe</h3><p class="muted">${partnerCount()} pilihan · public figures + original characters · usia berkembang mengikuti kalender.</p></div><span class="tag">${list.length} shown</span></div><div class="grid">${list.map(n=>`<div class="third card"><div class="row"><b>${n.name}</b><span class="tag">${n.kind}</span></div><p>${n.job} · ${n.age} · ${n.nationality}</p><p class="muted">${n.personality} · ❤️ ${n.affection}% · Trust ${n.trust}% · ${n.status}</p><div class="actions"><button class="btn small" onclick="viewPartner('${n.id}')">Profile</button><button class="btn small" onclick="openChat('${n.id}')">Chat</button><button class="btn small primary" onclick="datePartner('${n.id}')">Date</button></div></div>`).join("")}</div></div>`}
function viewPartner(id){const n=partnerById(id);if(!n)return;openModal(`👤 ${n.name}`,`<div class="item"><h3>${n.name}</h3><p>${n.kind} · ${n.job}</p><p>Age: ${n.age} · Nationality: ${n.nationality}</p><p>Personality: ${n.personality}</p><p>Relationship: ${n.status}</p><p>Affection: ${n.affection}% · Trust: ${n.trust}% · Jealousy: ${n.jealousy}%</p></div><div class="actions"><button class="btn primary" onclick="datePartner('${id}')">Ask on a Date</button><button class="btn" onclick="openChat('${id}')">Open Chat</button>${n.status==='Partner'?`<button class="btn gold" onclick="propose('${id}')">Propose 💍</button>`:''}${n.status==='Engaged'?`<button class="btn gold" onclick="marry('${id}')">Marry 💒</button>`:''}</div>`)}
function datePartner(id){const n=partnerById(id);if(!n)return;n.affection=Math.min(100,n.affection+12);n.trust=Math.min(100,n.trust+7);if(n.affection>=30)n.status="Dating";if(n.affection>=55)n.status="Partner";n.history.push(`Date on ${S.world.day}/${S.world.month}/${S.world.year}`);dateAdvance(1);save();render();toast(`Date with ${n.name} went well ❤️`)}
function family(){ensureFamily();const n=activePartner();return headerCard()+`<div class="grid"><div class="half card"><h3>💍 Family Status</h3><p>Partner: ${n?n.name:"None"}</p><p>Status: ${n?n.status:"Single"}</p><p>Engaged: ${S.family.engagedTo?"Yes":"No"} · Married: ${S.family.marriedTo?"Yes":"No"}</p><div class="actions">${n&&n.status==='Partner'?`<button class="btn gold" onclick="propose('${n.id}')">Propose</button>`:''}${n&&n.status==='Engaged'?`<button class="btn gold" onclick="marry('${n.id}')">Wedding</button>`:''}${n&&S.family.marriedTo?`<button class="btn primary" onclick="haveChild()">Have a Child</button>`:''}</div></div><div class="half card"><h3>👶 Children</h3><div class="list">${S.family.children.map(c=>`<div class="item row"><span>${c.gender==='Girl'?'👧':'👦'} ${c.name}</span><span>Age ${c.age}${c.movedOut?' · Independent':''}</span></div>`).join("")||`<div class="empty">Belum ada anak.</div>`}</div></div></div>`}
function calendar(){return headerCard()+`<div class="card"><h3>📅 Career Calendar</h3><p class="muted">${S.world.day}/${S.world.month}/${S.world.year} · ${S.world.season}</p><div class="actions"><button class="btn" onclick="dateAdvance(1);save();render()">+1 Day</button><button class="btn" onclick="dateAdvance(7);save();render()">+1 Week</button><button class="btn primary" onclick="dateAdvance(30);save();render()">+1 Month</button></div><hr><div class="list"><div class="item">⚽ Club Match — weekly simulation</div><div class="item">🌍 International Break — every 90 days</div><div class="item">🏆 Awards Night — yearly</div><div class="item">🎂 Birthdays & family milestones — automatic</div></div></div>`}
function awards(){return headerCard()+trophyRoom()+nationalTeam()}
function profile(){
 let p=S.player;
 return headerCard()+characterCard()+`<div class="grid"><div class="half card"><h3>Profile</h3><div class="formgrid"><label>Name<input id="nm" value="${p.name}"></label><label>Position<select id="ps">${POS.map(x=>`<option ${x===p.pos?"selected":""}>${x}</option>`).join("")}</select></label><label>Age<input id="age" type="number" value="${p.age}"></label><label>Nationality<input id="nat" value="${p.nationality||"Indonesia"}"></label><label>Jersey Number<input id="jersey" type="number" min="1" max="99" value="${p.jerseyNumber||9}"></label><label>Potential<input id="pot" type="number" value="${p.potential}"></label><label>Player Photo<input id="photoFile" type="file" accept="image/*" onchange="loadPlayerPhoto(event)"></label></div><br><button class="btn primary" onclick="saveProfile()">Save Profile</button></div><div class="half card"><h3>Career Records</h3><p>Matches: ${p.matches}</p><p>Goals: ${p.goals}</p><p>Assists: ${p.assists}</p><p>Trophies: ${p.trophies}</p><p>Contract: ${p.contract} years · Release clause ${money(p.release)}</p><button class="btn danger" onclick="resetGame()">Reset Universe</button></div></div>`
}
function saveProfile(){S.player.name=document.getElementById("nm").value||"Player";S.player.pos=document.getElementById("ps").value;S.player.age=Number(document.getElementById("age").value);S.player.nationality=document.getElementById("nat").value||"Indonesia";S.player.nationalTeam=S.player.nationality;S.player.potential=Number(document.getElementById("pot").value);S.player.jerseyNumber=Math.max(1,Math.min(99,Number(document.getElementById("jersey").value)||9));save();render();toast("Profile updated")}
function loadPlayerPhoto(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.player.photo=r.result;save();render();toast('Photo pemain tersimpan 📸')};r.readAsDataURL(f)}
function creatorConsole(){
 if(!S.creator.enabled)return;
 openModal("👑 CREATOR MODE",`<p><b>Universe control:</b> ${S.creator.slots} relationship slots · ${S.creator.email||"creator account"}</p><div class="formgrid">
 <label>Money (M)<input id="cmoney" type="number" value="${S.player.money}"></label><label>Fans<input id="cfans" type="number" value="${S.player.fans}"></label>
 <label>Followers<input id="cfollowers" type="number" value="${S.player.followers}"></label><label>Reputation<input id="crep" type="number" value="${S.player.reputation}"></label>
 <label>OVR<input id="covr" type="number" value="${S.player.ovr}"></label><label>Age<input id="cage" type="number" value="${S.player.age}"></label></div><br>
 <div class="actions"><button class="btn primary" onclick="godSave()">Apply Changes</button><button class="btn gold" onclick="godMax()">MAX EVERYTHING</button><button class="btn" onclick="spawnNews()">Spawn World Event</button><button class="btn" onclick="creatorTime()">Time Travel</button><button class="btn danger" onclick="S.creator.enabled=false;S.creator.slots=4;save();closeModal();render()">Disable Creator</button></div>
 <hr style="border-color:var(--line)"><h3>Relationship Control</h3><div class="list">${S.npc.map(n=>`<div class="item row"><span>${n.name} · ${n.status}</span><button class="btn small" onclick="forcePartner('${n.id}')">Force Partner</button></div>`).join("")}</div>`)
}
function godSave(){S.player.money=Number(document.getElementById("cmoney").value);S.player.fans=Number(document.getElementById("cfans").value);S.player.followers=Number(document.getElementById("cfollowers").value);S.player.reputation=Number(document.getElementById("crep").value);S.player.ovr=Math.min(99,Number(document.getElementById("covr").value));S.player.age=Number(document.getElementById("cage").value);save();closeModal();render();toast("Universe edited 👑")}
function godMax(){S.player.money=999999;S.player.fans=9999999;S.player.followers=9999999;S.player.reputation=100;S.player.ovr=99;S.player.potential=99;S.player.energy=100;S.player.health=100;S.player.morale=100;S.player.form=100;Object.keys(S.player.stats).forEach(k=>S.player.stats[k]=99);S.player.level=50;save();closeModal();render();toast("GOD MODE ACTIVE 🗿")}
function spawnNews(){worldNews();S.world.news[0].text="👑 CREATOR EVENT: "+pick(["A mega sponsor enters the league!","A mysterious transfer scandal shakes football!","A wonderkid appears out of nowhere!","A legendary manager returns!"]);save();creatorConsole()}
function creatorTime(){let n=prompt("Advance days:", "365");if(n){advanceDays(Number(n));closeModal();toast("Time travel complete.")}}
function forcePartner(id){let n=S.npc.find(x=>x.id===id);n.affection=100;n.trust=100;n.status="Partner";if(!S.relations.includes(id))S.relations.push(id);save();creatorConsole()}
function resetGame(){const first=confirm('RESET TOTAL: semua career, relationship, family, trophies, inventory, money dan calendar akan kembali ke awal. Lanjut?');if(!first)return;const second=confirm('Yakin 100%? Ini tidak bisa dibatalkan.');if(!second)return;localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);localStorage.removeItem(LEGACY_KEY);localStorage.removeItem(LEGACY_KEY_V2);location.reload()}
function render(){
 S.player.ovr=calcOVR();renderNav();document.getElementById("datePill").textContent=`${S.world.day}/${S.world.month}/${S.world.year} · ${S.world.season}`;
 let view={home,career,market,business,social,dating,partners,family,life,shop,national:()=>headerCard()+nationalTeam(),awards,calendar,world,profile}[S.tab]||home;document.getElementById("app").innerHTML=view()
}
function login(){
 openModal("WELCOME TO EAFC LIFE PRO",`<p>Build a football career while your social life, money, relationships and the football universe react to your decisions.</p>
 <label>Name<input id="loginName" value="${S.player.name}"></label><br>
 <label>Email<input id="loginEmail" type="email" placeholder="you@example.com" value="${S.creator.email||""}"></label><br><br>
 <button class="btn primary" onclick="startCareer()">Start Career</button>
 <p class="muted">Creator Mode otomatis terbuka untuk email creator yang terdaftar.</p>`)
}
function startCareer(){
 const name=document.getElementById("loginName").value.trim()||"Player";
 const email=document.getElementById("loginEmail").value.trim().toLowerCase();
 S.player.name=name;S.creator.email=email;
 if(CREATOR_EMAILS.includes(email)){S.creator.enabled=true;S.creator.slots=10;S.player.money=Math.max(S.player.money,50000);S.player.fans=Math.max(S.player.fans,500000);S.player.reputation=Math.max(S.player.reputation,90);toast("👑 Creator Mode unlocked!")}
 S.logged=true;save();closeModal();render()
}
if(location.hash==="#creator"){S.creator.enabled=true;S.creator.slots=10}
render();
if(!S.logged)login();
</script>
</body>
</html>
