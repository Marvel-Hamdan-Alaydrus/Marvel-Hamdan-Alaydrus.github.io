 const ints=["intlRegional","intlContinental","worldcup"];ints.forEach((comp,ci)=>{const total=COMPETITIONS[comp].matches;for(let r=1;r<=total;r++)arr.push({id:id++,competition:comp,round:r,date:fmtDate(45+ci*120+r*12),home:S.player.nationality||"Indonesia",away:pick(["Japan","China","Spain","Brazil","France","Germany","Argentina","USA","Morocco","Australia"].filter(x=>x!==(S.player.nationality||"Indonesia"))),status:"Scheduled"})});

function fixtureOpponent(f){return f.home===S.player.clubId?club(f.away).name:f.away===S.player.clubId?club(f.home).name:(f.home===S.player.nationality?f.away:f.home)}
function standingsFor(comp){const rows=clubs.map(c=>({id:c.id,name:c.name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));const map=Object.fromEntries(rows.map(x=>[x.id,x]));(S.fixtures||[]).filter(f=>f.competition===comp&&f.status==="Played").forEach(f=>{if(!map[f.home]||!map[f.away])return;let a=map[f.home],b=map[f.away];a.p++;b.p++;a.gf+=f.hs||0;a.ga+=f.as||0;b.gf+=f.as||0;b.ga+=f.hs||0;if((f.hs||0)>(f.as||0)){a.w++;a.pts+=3;b.l++}else if(f.hs===f.as){a.d++;b.d++;a.pts++;b.pts++}else{b.w++;b.pts+=3;a.l++}});return rows.sort((a,b)=>b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga)))}
function playScheduledFixture(id){const f=S.fixtures.find(x=>x.id===id);if(!f||f.status==="Played")return;const isPlayer=f.home===S.player.clubId||f.away===S.player.clubId||f.home===S.player.nationality;const my= S.player.ovr+S.player.form*.15;const opp=club(fixtureOpponent(f).id||S.player.clubId)?.strength||72;let hs=rand(0,4),as=rand(0,4);if(isPlayer){if(f.home===S.player.clubId||f.home===S.player.nationality)hs=Math.max(hs,Math.round(my/30));else as=Math.max(as,Math.round(my/30));S.player.matches++;if((f.home===S.player.clubId||f.home===S.player.nationality)&&hs>as)S.player.fans+=rand(50,500);if((f.away===S.player.clubId)&&as>hs)S.player.fans+=rand(50,500);}

function playMatch(){
 if(S.player.energy<30)return toast("Kamu terlalu lelah untuk main.");
 S.player.energy-=30;S.player.matches++;
 const c=club(S.player.clubId), opp=pick(clubs.filter(x=>x.id!==c.id));
 const my=(S.player.ovr+S.player.form*.15+S.career.managerTrust*.08)+(Math.random()*12-6);
 const enemy=opp.strength+(Math.random()*12-6);
 let log=[],score=0,oppScore=0,rating=6.2+Math.random()*1.2;
 for(let m=1;m<=90;m+=rand(7,14)){
   let chance=Math.random();
   if(chance<Math.max(.07,(my-enemy)/130+.10)){score++;S.player.goals++;rating+=.45;log.push(`${m}' ⚽ GOAL! ${S.player.name} finds the net.`)}
   else if(chance<.22){S.player.assists++;rating+=.15;log.push(`${m}' 🎯 Key pass creates danger.`)}
   else if(chance>.93){rating-=.25;log.push(`${m}' 🟨 Yellow card after a late challenge.`)}
   else log.push(`${m}' Game flows through midfield...`)
 }
 if(enemy>my && score===0)oppScore=rand(1,3); else if(enemy>my)oppScore=Math.max(1,score+rand(-1,1)); else oppScore=rand(0,Math.max(1,score));
 const result=score>oppScore?"WIN":score===oppScore?"DRAW":"LOSS";
 if(result==="WIN"){S.player.fans+=rand(20,70);S.player.reputation+=2;S.career.managerTrust=Math.min(100,S.career.managerTrust+4)}
 if(result==="LOSS"){S.player.morale-=5;S.career.managerTrust=Math.max(0,S.career.managerTrust-3)}
 S.career.lastRating=pct(rating);addXP(70+Math.max(0,score)*30);
 S.world.news.unshift({day:`${S.world.day}/${S.world.month}`,text:`${c.name} ${score}-${oppScore} ${opp.name}. ${S.player.name} rated ${pct(rating)}.`});
 openModal("MATCH RESULT",`<div class="score">${c.short} ${score} — ${oppScore} ${opp.short}</div><p>Result: <b class="${result==="WIN"?"green":result==="LOSS"?"red":"gold"}">${result}</b> · Rating <b>${pct(rating)}</b></p><div class="matchlog">${log.map(x=>`<div>${x}</div>`).join("")}</div><br><button class="btn primary" onclick="closeModal();advanceDays()">Continue career</button>`);
 save();render()
}

const AWARD_RULES=[{name:"Ballon d'Or",type:"individual",rule:"Best overall season: performance, goals/assists, trophies, reputation and big-match impact."},{name:"The Best FIFA Men's Player",type:"individual",rule:"Season-long individual excellence plus international and club impact."},{name:"Golden Boot",type:"scoring",rule:"Highest official goals total across the eligible competition."},{name:"Golden Glove",type:"goalkeeper",rule:"Best goalkeeper profile based on clean sheets, saves and team results."},{name:"Young Player of the Year",type:"young",rule:"Top performer within the eligible young-player age band."},{name:"Player of the Season",type:"league",rule:"Best domestic league campaign."},{name:"Team of the Year",type:"squad",rule:"Best XI by position and season performance."},{name:"Club World Cup Golden Ball",type:"tournament",rule:"Best player of the Club World Cup."},{name:"World Cup Golden Ball",type:"international",rule:"Best player of the World Cup."},{name:"World Cup Golden Boot",type:"international",rule:"Top World Cup scorer."}];
function awardEligibility(){const p=S.player;return AWARD_RULES.map(a=>{let eligible=true,reason="Eligible pool";if(a.type==='young'&&p.age>23){eligible=false;reason="Age requirement not met"}if(a.type==='goalkeeper'&&p.pos!=="GK"){eligible=false;reason="GK only"}if(a.type==='scoring'&&p.goals<1){eligible=false;reason="Needs official goals"}return {...a,eligible,reason}})}
function awards(){const rules=awardEligibility();return headerCard()+trophyRoom()+`<div class="card"><h3>🏅 Individual Awards</h3><p class="muted">Eligibility is evaluated at season/tournament end. Real-world award concepts are modeled here; voting/juries are simulated by RV Sports.</p><div class="list">${rules.map(a=>`<div class="item row"><div><b>${a.name}</b><br><span class="muted">${a.rule}</span></div><span class="tag">${a.eligible?"Eligible":"Not eligible"}</span></div>`).join("")}</div></div><div class="card"><h3>🏆 Trophy Types</h3><div class="grid"><div class="third item"><b>Club Trophies</b><br><span class="muted">League, National Cup, Super Cup, Continental, Club World Cup</span></div><div class="third item"><b>National Team</b><br><span class="muted">Regional, Continental, World Cup</span></div><div class="third item"><b>Personal</b><br><span class="muted">Ballon d'Or, The Best, Golden Boot, Golden Glove and more</span></div></div></div>`}
function profile(){
 let p=S.player;
 return headerCard()+characterCard()+`<div class="grid"><div class="half card"><h3>Profile</h3><div class="formgrid"><label>Name<input id="nm" value="${p.name}"></label><label>Position<select id="ps">${POS.map(x=>`<option ${x===p.pos?"selected":""}>${x}</option>`).join("")}</select></label><label>Age<input id="age" type="number" min="16" max="100" value="${p.age}"></label><label>Birth Date<input id="birthDate" type="date" value="${p.birthDate}"></label><label>Birth Place<input id="birthPlace" value="${p.birthPlace}"></label><label>Birth Time<input id="birthTime" type="time" value="${p.birthTime}"></label><label>Nationality<input id="nat" value="${p.nationality||"Indonesia"}"></label><label>Jersey Number<input id="jersey" type="number" min="1" max="99" value="${p.jerseyNumber||9}"></label><label>Potential<input id="pot" type="number" min="1" max="99" value="${p.potential}"></label><label>Player Photo<input id="photoFile" type="file" accept="image/*" onchange="loadPlayerPhoto(event)"></label></div><br><button class="btn primary" onclick="saveProfile()">Save Profile</button></div><div class="half card"><h3>Career Records</h3><p>Matches: ${p.matches}</p><p>Goals: ${p.goals}</p><p>Assists: ${p.assists}</p><p>Trophies: ${p.trophies}</p><p>Contract: ${p.contract} years · Release clause ${money(p.release)}</p><button class="btn danger" onclick="resetGame()">🔄 Mulai Ulang</button><button class="btn" onclick="restoreBackup()">↩️ Pulihkan Data Terakhir</button><button class="btn gold" onclick="creatorRecovery()">🔐 Admin Recovery</button></div></div>`
}
function saveProfile(){S.player.name=document.getElementById("nm").value||"Player";S.player.pos=document.getElementById("ps").value;S.player.birthDate=document.getElementById("birthDate").value||S.player.birthDate;S.player.birthPlace=document.getElementById("birthPlace").value||S.player.birthPlace;S.player.birthTime=document.getElementById("birthTime").value||S.player.birthTime;S.player.age=isoAge(S.player.birthDate);S.player.nationality=document.getElementById("nat").value||"Indonesia";S.player.nationalTeam=S.player.nationality;S.player.potential=Number(document.getElementById("pot").value);S.player.jerseyNumber=Math.max(1,Math.min(99,Number(document.getElementById("jersey").value)||9));save();render();toast("Profile updated")}
function loadPlayerPhoto(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.player.photo=r.result;save();render();toast('Photo pemain tersimpan 📸')};r.readAsDataURL(f)}
function creatorRecovery(){
 const email=(prompt("Admin Recovery — masukkan email creator:",S.creator.email||"")||"").trim().toLowerCase();
 if(!CREATOR_EMAILS.includes(email))return toast("Email creator tidak terdaftar.");
 S.creator.enabled=true;S.creator.slots=10;S.creator.email=email;S.logged=true;
 save();render();toast("👑 Creator Mode berhasil dipulihkan!");
}
function creatorConsole(){
 if(!S.creator.enabled)return;
 openModal("👑 CREATOR MODE",`<p><b>Universe control:</b> ${S.creator.slots} relationship slots · ${S.creator.email||"creator account"}</p><div class="formgrid">
 <label>Money (M)<input id="cmoney" type="number" value="${S.player.money}"></label><label>Fans<input id="cfans" type="number" value="${S.player.fans}"></label>
 <label>Followers<input id="cfollowers" type="number" value="${S.player.followers}"></label><label>Reputation<input id="crep" type="number" value="${S.player.reputation}"></label>
 <label>OVR<input id="covr" type="number" min="1" max="99" value="${S.player.ovr}"></label><label>Age<input id="cage" type="number" min="16" max="45" value="${S.player.age}"></label>
 <label>PAC<input id="cPAC" type="number" min="1" max="99" value="${S.player.stats.PAC}"></label><label>SHO<input id="cSHO" type="number" min="1" max="99" value="${S.player.stats.SHO}"></label>
 <label>PAS<input id="cPAS" type="number" min="1" max="99" value="${S.player.stats.PAS}"></label><label>DRI<input id="cDRI" type="number" min="1" max="99" value="${S.player.stats.DRI}"></label>
 <label>DEF<input id="cDEF" type="number" min="1" max="99" value="${S.player.stats.DEF}"></label><label>PHY<input id="cPHY" type="number" min="1" max="99" value="${S.player.stats.PHY}"></label></div><br>
 <div class="actions"><button class="btn primary" onclick="godSave()">Apply Changes</button><button class="btn gold" onclick="godMax()">MAX EVERYTHING</button><button class="btn" onclick="spawnNews()">Spawn World Event</button><button class="btn" onclick="creatorTime()">Time Travel</button><button class="btn danger" onclick="S.creator.enabled=false;S.creator.slots=4;S.creator.ovrOverride=null;save();closeModal();render()">Disable Creator</button></div>
 <hr style="border-color:var(--line)"><h3>Relationship Control</h3><div class="list">${S.npc.map(n=>`<div class="item row"><span>${n.name} · ${n.status}</span><button class="btn small" onclick="forcePartner('${n.id}')">Force Partner</button></div>`).join("")}</div>`)
}
function godSave(){
 S.player.money=Math.max(0,Number(document.getElementById("cmoney").value)||0);
 S.player.fans=Math.max(0,Number(document.getElementById("cfans").value)||0);
 S.player.followers=Math.max(0,Number(document.getElementById("cfollowers").value)||0);
 S.player.reputation=pct(Number(document.getElementById("crep").value));
 S.creator.ovrOverride=Math.min(99,Math.max(1,Number(document.getElementById("covr").value)||1));
 S.player.ovr=S.creator.ovrOverride;
 S.player.age=Math.max(16,Math.min(LIMITS.AGE,Number(document.getElementById("cage").value)||18));
 ["PAC","SHO","PAS","DRI","DEF","PHY"].forEach(k=>{const el=document.getElementById("c"+k);if(el)S.player.stats[k]=Math.min(99,Math.max(1,Number(el.value)||1));});
 save();closeModal();render();toast("Universe edited 👑")
}
function godMax(){S.player.money=Number.MAX_SAFE_INTEGER;S.player.fans=Number.MAX_SAFE_INTEGER;S.player.followers=Number.MAX_SAFE_INTEGER;S.player.reputation=100;S.creator.ovrOverride=99;S.player.ovr=99;S.player.potential=99;S.player.energy=100;S.player.health=100;S.player.morale=100;S.player.form=100;Object.keys(S.player.stats).forEach(k=>S.player.stats[k]=99);S.player.level=50;save();closeModal();render();toast("GOD MODE ACTIVE 🗿") }
function spawnNews(){worldNews();S.world.news[0].text="👑 CREATOR EVENT: "+pick(["A mega sponsor enters the league!","A mysterious transfer scandal shakes football!","A wonderkid appears out of nowhere!","A legendary manager returns!"]);save();creatorConsole()}
function creatorTime(){let n=prompt("Advance days:", "365");if(n){advanceDays(Number(n));closeModal();toast("Time travel complete.")}}
function forcePartner(id){let n=S.npc.find(x=>x.id===id);n.affection=100;n.trust=100;n.status="Partner";if(!S.relations.includes(id))S.relations.push(id);save();creatorConsole()}
function resetGame(){const first=confirm('MULAI ULANG: data aktif akan diarsipkan sebagai backup lokal sebelum universe dihapus. Lanjut?');if(!first)return;const second=confirm('Backup akan disimpan di browser ini. Hapus universe sekarang?');if(!second)return;localStorage.setItem(KEY+"_backup",localStorage.getItem(KEY)||JSON.stringify(S));localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);localStorage.removeItem(LEGACY_KEY);localStorage.removeItem(LEGACY_KEY_V2);location.reload()}
function restoreBackup(){const b=localStorage.getItem(KEY+"_backup");if(!b)return toast("Belum ada backup terakhir.");if(!confirm("Pulihkan universe dari backup terakhir? Data aktif akan diganti."))return;localStorage.setItem(KEY,b);location.reload()}
function render(){
 S.player.ovr=calcOVR();renderNav();document.getElementById("datePill").textContent=`${S.world.day}/${S.world.month}/${S.world.year} · ${S.world.season}`;
 let view={home,career,market,business,social,dating,partners,family,life,shop,national:()=>headerCard()+nationalTeam(),awards,calendar,world,profile}[S.tab]||home;document.getElementById("app").innerHTML=view()
}
function login(){
 openModal("WELCOME TO EAFC LIFE PRO",`<p>Build a football career while your social life, money, relationships and the football universe react to your decisions.</p>
 <label>Name<input id="loginName" value="${S.player.name}"></label><br>
 <label>Email<input id="loginEmail" type="email" placeholder="you@example.com" value="${S.creator.email||""}"></label><br><br>
 <button class="btn primary" onclick="startCareer()">Start Career</button>
 <p class="muted">Creator Mode dapat dipulihkan kapan saja lewat tombol Admin Recovery dengan email creator yang terdaftar.</p>`)
}
function startCareer(){
 const name=document.getElementById("loginName").value.trim()||"Player";
 const email=document.getElementById("loginEmail").value.trim().toLowerCase();
 S.player.name=name;S.creator.email=email;
 if(CREATOR_EMAILS.includes(email)){S.creator.enabled=true;S.creator.slots=10;S.creator.ovrOverride=S.creator.ovrOverride??null;S.player.money=Math.max(S.player.money,50000);S.player.fans=Math.max(S.player.fans,500000);S.player.reputation=Math.max(S.player.reputation,90);toast("👑 Creator Mode unlocked!")}
 S.logged=true;save();closeModal();render()
}
if(location.hash==="#creator"){S.creator.enabled=true;S.creator.slots=10}
seedFixtures();S.player.age=isoAge(S.player.birthDate);save();render();
if(!S.logged)login();
</script>
</body>
</html>
