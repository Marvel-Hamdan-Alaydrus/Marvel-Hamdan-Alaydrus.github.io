<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Football: Be A Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #070b14, #111c31, #070b14);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px 0;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(11, 18, 32, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            padding: 25px 20px;
            text-align: center;
            max-height: 92vh;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar { width: 4px; }
        .container::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .game-title {
            font-size: 26px;
            font-weight: 900;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3px;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .game-subtitle {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
        }

        .input-group {
            background: rgba(30, 41, 59, 0.5);
            padding: 12px 15px;
            border-radius: 14px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 11px 14px;
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .status-badge {
            margin-top: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.creator { color: #10b981; }
        .status-badge.user { color: #f59e0b; }

        .menu-list { display: flex; flex-direction: column; gap: 10px; }

        .menu-btn, .action-btn {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .menu-btn:hover, .action-btn:hover {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #070b14;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.4);
            border-color: transparent;
        }

        .action-btn {
            justify-content: center;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #070b14;
            margin-top: 10px;
            font-weight: 700;
        }

        .back-btn {
            background: #1e293b;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 15px;
            float: left;
        }
        .back-btn:hover { background: #334155; }

        .section-header {
            font-size: 15px;
            color: #00d2ff;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .stat-slider-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .stat-slider-group label {
            font-size: 11px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }
        .stat-slider-group input[type="range"] {
            width: 100%;
            accent-color: #00d2ff;
            margin-top: 4px;
        }

        /* ================= KARTU PEMAIN EA SPORTS FC MOBILE STYLE ================= */
        .card-container {
            position: relative;
            width: 280px;
            height: 420px;
            margin: 0 auto 20px auto;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden;
            text-align: left;
        }

        /* Tema Kartu Berdasarkan Tipe OVR */
        .card-bronze {
            background: linear-gradient(135deg, #8b5a2b, #4a2e12, #241607);
            border: 3px solid #cd7f32;
            color: #f3d1b0;
        }
        .card-silver {
            background: linear-gradient(135deg, #94a3b8, #475569, #1e293b);
            border: 3px solid #cbd5e1;
            color: #f8fafc;
        }
        .card-gold {
            background: linear-gradient(135deg, #ca8a04, #854d0e, #422006);
            border: 3px solid #facc15;
            color: #fef08a;
        }
        .card-legendary {
            background: linear-gradient(135deg, #7e22ce, #4c1d95, #1e1b4b);
            border: 3px solid #c084fc;
            box-shadow: 0 0 25px rgba(192, 132, 252, 0.6);
            color: #f3e8ff;
        }
        .card-goat {
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #312e81);
            border: 3px solid #38bdf8;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.8);
            color: #e0f2fe;
            animation: goatGlow 3s infinite alternate;
        }

        @keyframes goatGlow {
            0% { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
            50% { border-color: #facc15; box-shadow: 0 0 35px rgba(250, 204, 21, 0.8); }
            100% { border-color: #c084fc; box-shadow: 0 0 25px rgba(192, 132, 252, 0.6); }
        }

        /* Header Kartu (OVR & Posisi di Kiri) */
        .fc-card-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 3;
            line-height: 1.1;
        }
        .fc-ovr {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
        }
        .fc-pos {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .fc-flag-club {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 14px;
        }
        .fc-club-badge {
            width: 22px;
            height: 22px;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        /* FOTO DI ATUR DI TENGAH KARTU */
        .fc-player-img-container {
            position: absolute;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            width: 190px;
            height: 220px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 2;
            overflow: hidden;
        }
        .fc-player-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
        }
        .fc-player-avatar-text {
            font-size: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* Efek Spesial Animasi Bola untuk GOAT (OVR 99) */
        .goat-ball-animation {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            z-index: 4;
            animation: spinBall 4s linear infinite;
        }
        @keyframes spinBall {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Label Spesial Banner Atas Kartu */
        .special-card-badge {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 2px 10px;
            border-radius: 10px;
            z-index: 4;
        }
        .badge-legendary { background: #9333ea; color: #fff; }
        .badge-goat { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; box-shadow: 0 0 10px #f59e0b; }

        /* Footer Kartu (Nama & Grid Stat) */
        .fc-card-footer {
            z-index: 3;
            margin-top: auto;
        }
        .fc-player-name {
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .fc-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 20px;
            font-size: 11px;
            font-weight: 700;
            padding: 0 5px;
        }
        .fc-stat-row {
            display: flex;
            justify-content: space-between;
        }

        /* Daftar Penawaran Klub */
        .club-offer-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .club-info h4 { font-size: 13px; color: #00d2ff; display: flex; align-items: center; gap: 6px; }
        .club-info p { font-size: 10px; color: #94a3b8; margin-top: 2px; }
        .sign-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .sign-btn:hover { background: #059669; }

        .hidden { display: none !important; }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ================= 1. HOME SCREEN ================= -->
        <div id="home-screen">
            <div class="game-title">E-Football</div>
            <div class="game-subtitle">Be A Pro Career Simulator</div>

            <div class="input-group">
                <label for="user-email">Masukkan Email Anda:</label>
                <input type="email" id="user-email" placeholder="contoh: sayyidrahmathamdani@gmail.com" oninput="checkEmailRole()">
                <div id="role-status" class="status-badge user">Status: Standard User (Mode Acak)</div>
            </div>

            <div class="menu-list">
                <button class="menu-btn" onclick="goToCareerSetup()">Karier Baru <span>⚽</span></button>
                <button class="menu-btn" onclick="alertMenu('Mode Club')">Mode Club <span>🛡️</span></button>
                <button class="menu-btn" onclick="alertMenu('Mode Kejuaraan Dunia')">Mode Kejuaraan Dunia <span>🏆</span></button>
                <button class="menu-btn" onclick="alertMenu('Permainan Tersimpan')">Permainan Tersimpan <span>💾</span></button>
                <button class="menu-btn" onclick="alertMenu('Pencapaian')">Pencapaian <span>🏅</span></button>
            </div>
        </div>

        <!-- ================= 2. CAREER SETUP ================= -->
        <div id="career-setup-screen" class="hidden">
            <div class="clearfix"><button class="back-btn" onclick="goScreen('home-screen')">← Kembali</button></div>
            <div class="section-header">Pengaturan Karier Baru</div>

            <div class="input-group">
                <label>Level Awal Pemain:</label>
                <select id="setup-level">
                    <option value="amatir">Amatir (OVR 50 - 58)</option>
                    <option value="normal">Normal (OVR 59 - 67)</option>
                    <option value="berbakat">Berbakat (OVR 68 - 75)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Tipe Mode Pembuatan:</label>
                <div id="creator-mode-info" style="font-size: 11px; color: #f59e0b; font-weight: 600;">Mode Standard (Stat diacak otomatis)</div>
            </div>

            <div class="input-group">
                <label>Tingkat Kesulitan Permainan:</label>
                <select id="setup-difficulty">
                    <option value="mudah">Mudah</option>
                    <option value="normal" selected>Normal</option>
                    <option value="susah">Susah</option>
                </select>
            </div>

            <button class="action-btn" onclick="goToCharacterForm()">Lanjut Buat Karakter ➔</button>
        </div>

        <!-- ================= 3. CHARACTER FORM SCREEN ================= -->
        <div id="character-form-screen" class="hidden">
            <div class="clearfix"><button class="back-btn" onclick="goScreen('career-setup-screen')">← Kembali</button></div>
            <div class="section-header">Buat Karakter Pemain</div>

            <div class="input-group"><label>Nama Depan:</label><input type="text" id="char-firstname" placeholder="Contoh: Sayyid"></div>
            <div class="input-group"><label>Nama Belakang:</label><input type="text" id="char-lastname" placeholder="Contoh: Rahmat"></div>
            <div class="input-group"><label>Nama Punggung (Jersey):</label><input type="text" id="char-shirtname" placeholder="Contoh: S. RAHMAT"></div>

            <div class="input-group">
                <label>Benua Asal:</label>
                <select id="char-continent" onchange="updateCountries()">
                    <option value="asia">Asia</option>
                    <option value="eropa">Eropa</option>
                    <option value="afrika">Afrika</option>
                    <option value="amerika-selatan">Amerika Selatan</option>
                    <option value="amerika-utara">Amerika Utara</option>
                </select>
            </div>

            <div class="input-group"><label>Negara Asal:</label><select id="char-country"></select></div>
            <div class="input-group"><label>Nomor Punggung:</label><input type="number" id="char-number" min="1" max="99" value="10"></div>

            <div class="input-group">
                <label>Pilih Avatar / Foto:</label>
                <select id="char-avatar-type" onchange="toggleAvatarInput()">
                    <option value="system">Gunakan 5 Emoji Avatar Sistem</option>
                    <option value="upload">Upload dari Gallery (URL Gambar)</option>
                </select>
            </div>

            <div class="input-group" id="avatar-selection-box">
                <label>Pilih Avatar Sistem:</label>
                <select id="char-system-avatar">
                    <option value="👦">👦 Wajah 1</option>
                    <option value="🧑">🧑 Wajah 2</option>
                    <option value="🧔">🧔 Wajah 3</option>
                    <option value="👱">👱 Wajah 4</option>
                    <option value="🦸">🦸 Wajah 5</option>
                </select>
            </div>

            <div class="input-group hidden" id="avatar-upload-box">
                <label>Link URL Foto:</label><input type="text" id="char-custom-url" placeholder="https://contoh.com/foto.jpg">
            </div>

            <div class="input-group">
                <label>Posisi Bermain:</label>
                <select id="char-position">
                    <option value="ST">ST (Striker)</option>
                    <option value="CF">CF (Center Forward)</option>
                    <option value="LW">LW (Left Winger)</option>
                    <option value="RW">RW (Right Winger)</option>
                    <option value="CAM">CAM (Central Attacking Midfielder)</option>
                    <option value="CM">CM (Central Midfielder)</option>
                    <option value="CDM">CDM (Central Defensive Midfielder)</option>
                    <option value="LM">LM (Left Midfielder)</option>
                    <option value="RM">RM (Right Midfielder)</option>
                    <option value="RB">RB (Right Back)</option>
                    <option value="CB">CB (Center Back)</option>
                    <option value="LB">LB (Left Back)</option>
                    <option value="GK">GK (Goalkeeper)</option>
                </select>
            </div>

            <!-- Bagian Stat -->
            <div id="stat-configuration-section">
                <div class="section-header" style="font-size: 13px; margin-top: 15px;">Statistik Pemain (0 - 99)</div>
                <div id="stat-info-text" style="font-size: 11px; color: #f59e0b; margin-bottom: 10px; text-align: left;">Diacak otomatis.</div>

                <div class="stat-slider-group"><label>Kecepatan (PAC): <span id="val-speed">60</span></label><input type="range" id="stat-speed" min="1" max="99" value="60" disabled></div>
                <div class="stat-slider-group"><label>Tendangan (SHO): <span id="val-shoot">60</span></label><input type="range" id="stat-shoot" min="1" max="99" value="60" disabled></div>
                <div class="stat-slider-group"><label>Operan (PAS): <span id="val-passing">60</span></label><input type="range" id="stat-passing" min="1" max="99" value="60" disabled></div>
                <div class="stat-slider-group"><label>Giring Bola (DRI): <span id="val-dribble">60</span></label><input type="range" id="stat-dribble" min="1" max="99" value="60" disabled></div>
                <div class="stat-slider-group"><label>Pertahanan (DEF): <span id="val-defend">50</span></label><input type="range" id="stat-defend" min="1" max="99" value="50" disabled></div>
                <div class="stat-slider-group"><label>Fisik (PHY): <span id="val-physical">60</span></label><input type="range" id="stat-physical" min="1" max="99" value="60" disabled></div>
            </div>

            <button class="action-btn" onclick="finishCharacterCreation()">Konfirmasi Kartu & Klub ➔</button>
        </div>

        <!-- ================= 4. CARD & CLUB OFFERS SCREEN ================= -->
        <div id="card-reveal-screen" class="hidden">
            <div class="section-header">Konfirmasi Kartu Pemain</div>
            
            <!-- Tempat Kartu FC Mobile Dinamis -->
            <div id="fc-card-render-area"></div>

            <div class="section-header" style="font-size: 14px; margin-top: 20px;">Penawaran Klub Masuk</div>
            <p style="font-size: 11px; color: #94a3b8; margin-bottom: 10px; text-align: left;">Pilih salah satu dari 10 klub top dunia asal negara Anda:</p>
            
            <div id="club-offers-list"></div>
        </div>

    </div>

    <script>
        const creatorEmails = [
            "sayyidrahmathamdani@gmail.com",
            "princemarvelerlangga@gmail.com"
        ];
        let isCreatorMode = false;

        function checkEmailRole() {
            const emailInput = document.getElementById("user-email").value.trim().toLowerCase();
            const statusBadge = document.getElementById("role-status");
            const creatorInfo = document.getElementById("creator-mode-info");

            if (creatorEmails.includes(emailInput)) {
                isCreatorMode = true;
                statusBadge.className = "status-badge creator";
                statusBadge.innerText = "Status: 👑 Creator Mode Aktif";
                creatorInfo.innerText = "✨ [Creator] Anda bebas mengatur Stat & OVR hingga 99 secara manual!";
                creatorInfo.style.color = "#10b981";
            } else {
                isCreatorMode = false;
                statusBadge.className = "status-badge user";
                statusBadge.innerText = "Status: Standard User (Mode Acak)";
                creatorInfo.innerText = "🔒 Mode Standard (Stat diacak otomatis)";
                creatorInfo.style.color = "#f59e0b";
            }
        }

        function goScreen(screenId) {
            document.getElementById("home-screen").classList.add("hidden");
            document.getElementById("career-setup-screen").classList.add("hidden");
            document.getElementById("character-form-screen").classList.add("hidden");
            document.getElementById("card-reveal-screen").classList.add("hidden");
            document.getElementById(screenId).classList.remove("hidden");
        }

        function goToCareerSetup() {
            if (document.getElementById("user-email").value.trim() === "") {
                alert("Harap masukkan email Anda terlebih dahulu!");
                return;
            }
            goScreen('career-setup-screen');
        }

        function alertMenu(menuName) { alert(`Fitur ${menuName} dalam pengembangan.`); }

        function goToCharacterForm() {
            goScreen('character-form-screen');
            updateCountries();
            setupStatSlidersPermission();
        }

        const countryData = {
            "asia": {
                "Indonesia": ["Persija Jakarta", "Persib Bandung", "Persebaya Surabaya", "Bali United", "PSM Makassar", "Arema FC", "Borneo FC", "PSIS Semarang", "Madura United", "Dewa United"],
                "Jepang": ["Vissel Kobe", "Yokohama F. Marinos", "Kawasaki Frontale", "Urawa Red Diamonds", "Kashima Antlers", "Sanfrecce Hiroshima", "FC Tokyo", "Nagoya Grampus", "Cerezo Osaka", "Gamba Osaka"],
                "Korea Selatan": ["Ulsan HD", "Jeonbuk Hyundai", "FC Seoul", "Pohang Steelers", "Suwon FC", "Incheon United", "Daegu FC", "Jeju United", "Gwangju FC", "Gangwon FC"],
                "Arab Saudi": ["Al Hilal", "Al Nassr", "Al Ittihad", "Al Ahli", "Al Shabab", "Al Ettifaq", "Al Taawoun", "Al Fateh", "Al Riyadh", "Al Fayha"],
                "Qatar": ["Al Sadd", "Al Duhail", "Al Rayyan", "Al Gharafa", "Al Wakrah", "Qatar SC", "Al Arabi", "Umm Salal", "Ahli Doha", "Mesaimeer"]
            },
            "eropa": {
                "Inggris": ["Manchester City", "Arsenal", "Liverpool", "Manchester United", "Chelsea", "Tottenham Hotspur", "Newcastle United", "Aston Villa", "West Ham United", "Brighton"],
                "Spanyol": ["Real Madrid", "Barcelona", "Atletico Madrid", "Real Sociedad", "Villarreal", "Real Betis", "Athletic Bilbao", "Valencia", "Sevilla", "Girona"],
                "Jerman": ["Bayern Munich", "Bayer Leverkusen", "Borussia Dortmund", "RB Leipzig", "VfB Stuttgart", "Eintracht Frankfurt", "Wolfsburg", "Borussia Monchengladbach", "Werder Bremen", "Hoffenheim"],
                "Italia": ["Inter Milan", "AC Milan", "Juventus", "Napoli", "Atalanta", "AS Roma", "Lazio", "Fiorentina", "Bologna", "Torino"],
                "Prancis": ["Paris Saint-Germain", "Marseille", "Monaco", "Lille", "Lyon", "Nice", "Lens", "Rennes", "Strasbourg", "Reims"]
            },

        function updateCountries() {
            const continent = document.getElementById("char-continent").value;
            const countrySelect = document.getElementById("char-country");
            countrySelect.innerHTML = "";
            
            const countriesObj = countryData[continent];
            for (let countryName in countriesObj) {
                let opt = document.createElement("option");
                opt.value = countryName;
                opt.innerText = countryName;
                countrySelect.appendChild(opt);
            }
        }

        function toggleAvatarInput() {
            const type = document.getElementById("char-avatar-type").value;
            if (type === "system") {
                document.getElementById("avatar-selection-box").classList.remove("hidden");
                document.getElementById("avatar-upload-box").classList.add("hidden");
            } else {
                document.getElementById("avatar-selection-box").classList.add("hidden");
                document.getElementById("avatar-upload-box").classList.remove("hidden");
            }
        }

        function setupStatSlidersPermission() {
            const sliders = document.querySelectorAll("#stat-configuration-section input[type='range']");
            const infoText = document.getElementById("stat-info-text");

            if (isCreatorMode) {
                sliders.forEach(slider => {
                    slider.disabled = false;
                    slider.oninput = function() { document.getElementById("val-" + getSliderKey(this.id)).innerText = this.value; };
                });
                infoText.innerText = "👑 [Creator Mode] Geser slider nilai 1 - 99 untuk mengatur OVR & stat secara bebas!";
                infoText.style.color = "#10b981";
            } else {
                sliders.forEach(slider => slider.disabled = true);
                infoText.innerText = "🔒 Statistik diacak otomatis sesuai Level Awal.";
                infoText.style.color = "#f59e0b";
                generateRandomStatsForUser();
            }
        }

        function getSliderKey(id) {
            return id.replace('stat-', '');
        }

        function generateRandomStatsForUser() {
            const level = document.getElementById("setup-level").value;
            let min = 50, max = 58;
            if (level === 'normal') { min = 59; max = 67; }
            if (level === 'berbakat') { min = 68; max = 75; }

            ['speed', 'shoot', 'passing', 'dribble', 'defend', 'physical'].forEach(st => {
                let val = Math.floor(Math.random() * (max - min + 1)) + min;
                document.getElementById("stat-" + st).value = val;
                document.getElementById("val-" + st).innerText = val;
            });
        }

        function finishCharacterCreation() {
            const firstName = document.getElementById("char-firstname").value.trim();
            const lastName = document.getElementById("char-lastname").value.trim();
            if (!firstName || !lastName) { alert("Isi Nama Depan dan Belakang terlebih dahulu!"); return; }

            let spd = parseInt(document.getElementById("stat-speed").value);
            let sht = parseInt(document.getElementById("stat-shoot").value);
            let pas = parseInt(document.getElementById("stat-passing").value);
            let dri = parseInt(document.getElementById("stat-dribble").value);
            let def = parseInt(document.getElementById("stat-defend").value);
            let phy = parseInt(document.getElementById("stat-physical").value);

            let avgOvr = Math.round((spd + sht + pas + dri + def + phy) / 6);
            if (avgOvr > 99) avgOvr = 99;

            let pos = document.getElementById("char-position").value;
            let country = document.getElementById("char-country").value;
            let shirtName = document.getElementById("char-shirtname").value.trim() || (firstName.charAt(0) + ". " + lastName).toUpperCase();
            let num = document.getElementById("char-number").value;

            renderFCCard(avgOvr, pos, shirtName, country, num, spd, sht, pas, dri, def, phy);
            generateClubOffers(country, avgOvr);
            goScreen('card-reveal-screen');
        }

        function renderFCCard(ovr, pos, name, country, num, spd, sht, pas, dri, def, phy) {
            let cardClass = "card-bronze";
            let specialBadgeHtml = "";

            if (ovr >= 70 && ovr < 85) {
                cardClass = "card-silver";
            } else if (ovr >= 85 && ovr < 95) {
                cardClass = "card-gold";
            } else if (ovr >= 95 && ovr < 99) {
                cardClass = "card-legendary";
                specialBadgeHtml = `<div class="special-card-badge badge-legendary">⭐ Legendary ⭐</div>`;
            } else if (ovr >= 99) {
                cardClass = "card-goat";
                specialBadgeHtml = `
                    <div class="special-card-badge badge-goat">🐐 G.O.A.T 🐐</div>
                    <div class="goat-ball-animation">⚽</div>
                `;
            }

            let avatarHtml = "";
            let avatarType = document.getElementById("char-avatar-type").value;
            if (avatarType === "system") {
                let emoji = document.getElementById("char-system-avatar").value;
                avatarHtml = `<div class="fc-player-avatar-text">${emoji}</div>`;
            } else {
                let url = document.getElementById("char-custom-url").value.trim();
                if (url) {
                    avatarHtml = `<img src="${url}" alt="Player">`;
                } else {
                    avatarHtml = `<div class="fc-player-avatar-text">👤</div>`;
                }
            }

            const renderArea = document.getElementById("fc-card-render-area");
            renderArea.innerHTML = `
                <div class="card-container ${cardClass}">
                    ${specialBadgeHtml}
                    <div class="fc-card-header">
                        <div class="fc-ovr">${ovr}</div>
                        <div class="fc-pos">${pos}</div>
                        <div class="fc-flag-club">
                            <span>📍</span>
                            <div class="fc-club-badge" title="${country}">🛡️</div>
                        </div>
                    </div>

                    <div class="fc-player-img-container">
                        ${avatarHtml}
                    </div>

                    <div class="fc-card-footer">
                        <div class="fc-player-name">${name}</div>
                        <div class="fc-stats-grid">
                            <div class="fc-stat-row"><span>PAC</span><span>${spd}</span></div>
                            <div class="fc-stat-row"><span>DRI</span><span>${dri}</span></div>
                            <div class="fc-stat-row"><span>SHO</span><span>${sht}</span></div>
                            <div class="fc-stat-row"><span>DEF</span><span>${def}</span></div>
                            <div class="fc-stat-row"><span>PAS</span><span>${pas}</span></div>
                            <div class="fc-stat-row"><span>PHY</span><span>${phy}</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateClubOffers(country, ovr) {
            const listEl = document.getElementById("club-offers-list");
            listEl.innerHTML = "";

            const continent = document.getElementById("char-continent").value;
            let clubsArray = countryData[continent][country] || ["Klub Lokal 1", "Klub Lokal 2"];

            let shuffled = [...clubsArray].sort(() => 0.5 - Math.random());
            let selectedClubs = shuffled.slice(0, 4);

            selectedClubs.forEach((clubName, index) => {
                let tier = index < 2 ? "Liga Utama (Tier 1)" : "Divisi 2 (Tier 2)";
                let ratingKlub = index < 2 ? ovr + 3 : ovr - 2;
                if (ratingKlub > 99) ratingKlub = 99;

                let card = document.createElement("div");
                card.className = "club-offer-card";
                card.innerHTML = `
                    <div class="club-info">
                        <h4>🛡️ ${clubName}</h4>
                        <p>${tier} | Rekomendasi OVR: ${ratingKlub}</p>
                    </div>
                    <button class="sign-btn" onclick="selectClub('${clubName}')">Pilih Kontrak</button>
                `;
                listEl.appendChild(card);
            });
        }

        function selectClub(clubName) {
            alert(`Selamat! Anda resmi menandatangani kontrak profesional bersama ${clubName}. Gameplay menuju Dashboard Utama akan segera dimulai.`);
        }
    </script>
