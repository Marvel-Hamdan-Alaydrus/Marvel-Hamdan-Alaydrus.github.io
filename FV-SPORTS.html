function uid(prefix="id"){

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function clamp(n,min,max){
  n=Number(n);
  if(!Number.isFinite(n))n=min;
  return Math.max(min,Math.min(max,n));
}

  return String(v??"")

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[x]));
}

function avg(obj){
  const values=Object.values(obj).map(Number);
  if(!values.length)return 0;
  return Math.round(values.reduce((a,b)=>a+b,0)/values.length);
}

  },3000);
}

function log(text){
  const s=S();
  if(!s)return;

  s.logs.unshift(
    `[${s.calendar.day}/${s.calendar.month}/${s.calendar.year}] ${text}`
  );

  s.logs=s.logs.slice(0,150);
}

function spendEnergy(amount){
  const s=S();
  if(!s)return false;

  if(s.godMode)return true;

  if(s.football.energy<amount){
    toast("Energy tidak cukup.");
    return false;
  }

  s.football.energy-=amount;
  return true;
}

function spendCash(amount){
  const s=S();
  if(!s)return false;

  if(s.economy.cash<amount){
    toast("Uang tidak cukup.");
    return false;
  }

  s.economy.cash-=amount;
  return true;
}

function borderById(id){
  return BORDERS.find(x=>x.id===id)||BORDERS[0];
}

function OVR(){
  const s=S();
  if(!s)return 0;

  if(
    Number.isFinite(s.football.manualOVR) &&
    s.football.manualOVR>=1
  ){
    return clamp(s.football.manualOVR,1,99);
  }

  return avg(s.football.stats);
}

function unlockOVRBorders(){
  const s=S();
  if(!s)return;

  BORDERS.forEach(b=>{
    if(b.need && OVR()>=b.need && !s.inventory.borders.includes(b.id)){
      s.inventory.borders.push(b.id);
      log(`Border ${b.name} unlocked.`);
    }
  });
}

function makePhotoDataURL(file,max=500,quality=.72){
  return new Promise((resolve,reject)=>{
    if(!file){
      reject(new Error("No file"));
      return;
    }

    if(!file.type.startsWith("image/")){
      reject(new Error("File bukan gambar"));
      return;
    }

    const reader=new FileReader();

    reader.onerror=()=>{
      reject(new Error("FileReader gagal"));
    };

    reader.onload=()=>{
      const img=new Image();

      img.onerror=()=>{
        reject(new Error("Gambar tidak bisa dibaca"));
      };

      img.onload=()=>{
        const scale=Math.min(
          1,
          max/Math.max(img.width,img.height)
        );

        const canvas=document.createElement("canvas");

        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));

        const ctx=canvas.getContext("2d");

        if(!ctx){
          reject(new Error("Canvas tidak tersedia"));
          return;
        }

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            quality
          )
        );
      };

      img.src=reader.result;
    };

    reader.readAsDataURL(file);
  });
}

function buildPartners(){
  const list=[];
  let number=1;

  COUNTRIES.forEach(country=>{
    RARITIES.forEach(rarity=>{
      for(let i=0;i<rarity.count;i++){

        const base=country.names[i%country.names.length];

        const suffix=i>=country.names.length
          ? " "+(Math.floor(i/country.names.length)+1)
          :"";

        let border="green";

        if(rarity.id==="UR")border="goat";
        else if(rarity.id==="SSS")border="star";
        else if(rarity.id==="SS")border="cosmic";
        else if(rarity.id==="S")border="gold";
        else if(rarity.id==="A")border="silver";

        list.push({
          id:"P"+String(number).padStart(3,"0"),
          name:base+suffix,
          age:19+((number*3)%15),
          country:country.id,
          countryName:country.name,
          rarity:rarity.id,
          job:JOBS[number%JOBS.length],
          personality:PERSONALITIES[number%PERSONALITIES.length],
          photo:"",
          borderId:border,
          affection:0,
          trust:50,
          jealousy:10,
          happiness:65,
          energy:80,
          status:"single",
          married:false,
          children:[],
          arc:0,
          inventory:["Starter Gift","Personal Journal"],
          story:[
            "Kalian pertama kali bertemu melalui RV-Gram.",

        <button
          class="btn choice"
          data-action="match-choice"
          data-choice="${i}"
        >
          <b>${c.title}</b>
          <br>
          <span class="small muted">
            ${c.desc}
          </span>
          <br>
          <span class="tiny">
            ${c.stat.toUpperCase()}
          </span>
        </button>

      `).join("")}

    </div>

  </div>
  `;
}

function matchChoice(index){

  const s=S();

  if(!matchState)return;

  const choices=[
    {stat:"passing",base:70,reward:"assist"},
    {stat:"dribbling",base:62,reward:"goal"},
    {stat:"shooting",base:58,reward:"goal"},
    {stat:"mentality",base:76,reward:"safe"}
  ];

  const c=choices[index];

  if(!c)return;

  const stat=s.football.stats[c.stat];

  let successChance=c.base+(stat-50)*.45;

  if(s.godMode)successChance=99;

  const success=chance(successChance);

  matchState.chances++;
  matchState.minute+=Math.floor(7+Math.random()*12);

  if(success){

    matchState.success++;

    if(c.reward==="goal"){
      matchState.scorePlayer++;
      s.football.goals++;
      s.stats.fame+=3;
      s.football.form=clamp(s.football.form+2,0,100);
      log(`GOAL! ${s.player.name} mencetak gol.`);
    }else if(c.reward==="assist"){
      s.football.assists++;
      s.stats.fame+=2;
      log(`${s.player.name} membuat assist.`);
    }else{
      s.football.form=clamp(s.football.form+1,0,100);
      log("Positioning berhasil dan tim mengontrol pertandingan.");
    }

  }else{

    s.football.form=clamp(s.football.form-1,0,100);

    if(chance(25)){
      matchState.scoreOpponent++;
    }

    log("Aksi gagal. Pertandingan menjadi lebih sulit.");
  }

  if(matchState.minute>=90 || matchState.chances>=5){
    finishMatch();
    return;
  }

  save();
  render();
}

function finishMatch(){

  const s=S();
  const m=matchState;

  if(m.scorePlayer>m.scoreOpponent){
    s.football.wins++;
    s.economy.cash+=3500;
    s.stats.fame+=5;
    log(`Menang ${m.scorePlayer}-${m.scoreOpponent}. Bonus ${money(3500)}.`);
  }else if(m.scorePlayer===m.scoreOpponent){
    s.football.draws++;
    s.economy.cash+=1500;
    log(`Hasil imbang ${m.scorePlayer}-${m.scoreOpponent}.`);
  }else{
    s.football.losses++;
    s.stats.fame=Math.max(0,s.stats.fame-1);
    log(`Kalah ${m.scorePlayer}-${m.scoreOpponent}.`);
  }

  s.football.appearances++;
  s.football.week++;

  if(s.football.week>38){
    s.football.week=1;
    s.football.season++;

    if(s.football.wins>s.football.losses){
      s.football.trophies++;
      s.stats.fame+=10;
      log("Season selesai dan tim meraih trophy.");
    }
  }

  s.football.marketValue+=m.success*3000;

  matchState=null;

  checkAchievements();
  save();
  render();

  toast("Match selesai.");
}

function gacha(){

  const s=S();

  if(!spendCash(2500))return;

  const rarityRoll=Math.random()*100;
  let cumulative=0;
  let rarity="B";

  for(const r of RARITIES){
    cumulative+=r.weight;

    if(rarityRoll<=cumulative){
      rarity=r.id;
      break;
    }
  }

  const pool=PARTNERS.filter(
    p=>p.rarity===rarity
  );

  const template=pick(pool);

  const existing=s.partners.find(
    p=>p.id===template.id
  );

  if(existing){

    existing.affection=clamp(
      existing.affection+8,
      0,
      100
    );

    log(`Duplicate ${template.name}. Affection +8.`);

    save();
    render();

    toast(`Duplicate ${template.name}. Bond meningkat.`);
    return;
  }

  const partner=JSON.parse(
    JSON.stringify(template)
  );

  partner.affection=5;

  s.partners.push(partner);

  if(rarity==="UR"){
    s.stats.fame+=5;
    log(`UR Partner didapat: ${partner.name}.`);
  }else{
    log(`Partner baru didapat: ${partner.name}.`);
  }

  checkAchievements();
  save();
  render();

  toast(`${rarity}! ${partner.name} bergabung.`);
}

function haveChild(partnerIndex){

  const s=S();
  const p=s.partners[partnerIndex];

  if(!p)return;

  if(p.affection<75){
    toast("Affection belum cukup.");
    return;
  }

  if(!spendCash(8000))return;

  const defaultName="Baby "+(s.children.length+1);

  const name=prompt(
    "Nama anak:",
    defaultName
  );

  if(name===null){
    s.economy.cash+=8000;
    return;
  }

  const clean=name.trim()||defaultName;

  s.children.push({
    id:uid("child"),
    name:clean,
    age:0,
    development:10,
    education:5,
    health:90,
    bond:70,
    parentPartner:p.id
  });

  p.children.push(clean);

  log(`Anak bernama ${clean} lahir.`);

  checkAchievements();
  save();
  render();
}

function raiseChild(index){

  const s=S();
  const c=s.children[index];

  if(!c)return;

  if(!spendCash(500))return;
  if(!spendEnergy(5))return;

  c.development=clamp(c.development+5,0,100);
  c.education=clamp(c.education+3,0,100);
  c.bond=clamp(c.bond+2,0,100);

  log(`Kamu menghabiskan waktu membesarkan ${c.name}.`);

  save();
  render();
}

function checkAchievements(){

  const unlock=id=>{

      s.achievements.push(id);
      log(`Achievement unlocked: ${id}.`);
    }
  };

  if(s.football.goals>=1)unlock("first_goal");
  if(s.football.goals>=5)unlock("five_goals");
  if(s.football.goals>=10)unlock("ten_goals");
  if(s.economy.cash>=1000000)unlock("millionaire");
  if(s.social.viral>=1)unlock("viral");
  if(s.partners.some(p=>p.married))unlock("married");
  if(s.children.length)unlock("parent");
  if(s.partners.length>=10)unlock("collector");
  if(s.partners.some(p=>p.rarity==="UR"))unlock("urhunter");
  if(OVR()>=80)unlock("elite");
  if(OVR()>=90)unlock("superstar");
  if(OVR()>=99)unlock("goat");
  if(s.economy.businesses.length>=3)unlock("business");
  if(s.economy.businesses.length===BUSINESSES.length)unlock("empire");
  if(s.social.followers>=1000000)unlock("followers");
  if(s.football.trophies>=1)unlock("trophy");
}

      <div class="card">

        <div class="center">

          <div class="avatar border-gold" style="margin:auto">

}

function savePartnerEdit(event){

  event.preventDefault();

  const s=S();

  const index=Number(
    document.getElementById("partnerEditIndex").value
  );

  const p=s.partners[index];

  if(!p)return;

  p.name=document.getElementById("partnerName").value.trim()||p.name;
  p.age=clamp(document.getElementById("partnerAge").value,16,100);
  p.countryName=document.getElementById("partnerCountry").value.trim()||p.countryName;
  p.job=document.getElementById("partnerJob").value.trim()||p.job;
  p.personality=document.getElementById("partnerPersonality").value.trim()||p.personality;
  p.notes=document.getElementById("partnerNotes").value.trim();

  save();

  closeModal();

  render();

  toast("Partner profile saved.");
}

function closeModal(){

  document
    .querySelectorAll(".modalwrap")
    .forEach(x=>x.remove());
}

/* ==========================================================
   TIME
   ========================================================== */

function advanceDay(days=1){

  const s=S();

  for(let i=0;i<days;i++){

    s.calendar.day++;

    if(s.calendar.day>30){

      s.calendar.day=1;
      s.calendar.month++;

      const income=s.economy.businesses.reduce(
        (total,b)=>total+b.income*b.level,
        0
      );

      if(income){

        s.economy.cash+=income;

        log(
          `Business income ${money(income)} masuk.`
        );

      }

      s.partners.forEach(p=>{

        if(p.jealousy>65 && chance(15)){

          p.affection=clamp(
            p.affection-2,
            0,
            100
          );

          log(`${p.name} merasa cemburu.`);

        }

      });

      s.children.forEach(c=>{

        if(chance(20)){

          c.age+=1;

          c.education=clamp(
            c.education+1,
            0,
            100
          );

        }

      });

      if(s.calendar.month>12){

        s.calendar.month=1;
        s.calendar.year++;

        s.football.season++;
        s.football.week=1;

        log(
          `Season ${s.football.season} dimulai.`
        );

      }

    }

  }

  randomNews();
  checkAchievements();

  save();
  render();
}

function randomNews(){

  const s=S();

  const headlines=[
    "Transfer window mulai memanas.",
    "Sponsor global mencari superstar baru.",
    "RV-Gram ramai membahas rising star.",
    "Fans menunggu kejutan besar musim ini.",
    "Media menyusun power ranking terbaru.",
    "Rumor hubungan kembali viral.",
    "Klub-klub mulai berburu wonderkid."
  ];

  s.news.unshift({
    id:uid("news"),
    title:pick(headlines)
  });

  s.news=s.news.slice(0,30);
}

/* ==========================================================
   RENDER
   ========================================================== */

function render(){

  let output="";

  if(screen==="landing"){

    output=landing();

  }else if(screen==="slots"){

    output=slotsScreen();

  }else if(screen==="create"){

    output=createScreen();

  }else{

    const pages={
      dashboard:dashboardScreen,
      football:footballScreen,
      training:trainingScreen,
      rest:restScreen,
      transfer:transferScreen,
      business:businessScreen,
      social:socialScreen,
      partners:partnersScreen,
      relationship:relationshipScreen,
      family:familyScreen,
      inventory:inventoryScreen,
      achievements:achievementsScreen,
      news:newsScreen,
      events:eventsScreen,
      profile:profileScreen,
      admin:adminScreen,
      gdd:gddScreen
    };

    const page=pages[screen];

    output=shell(
      page
      ? page()
      : dashboardScreen()
    );
  }

  const app=document.getElementById("app");

  if(app){
    app.innerHTML=output;
  }

  mobileMenu=false;
}

/* ==========================================================
   NAVIGATION
   ========================================================== */

function navigate(target){

  matchState=null;
  screen=target;
  closeModal();

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function logoutGame(){

  save();

  currentSlot=null;
  screen="landing";

  DB.logged=false;
  DB.isAdmin=false;

  render();
}

/* ==========================================================
   EVENT DELEGATION
   ========================================================== */

document.addEventListener("click",event=>{

  const el=event.target.closest("[data-action]");

  if(!el)return;

  const action=el.dataset.action;

  if(action==="create-slot"){

    currentSlot=Number(el.dataset.slot);
    creatorPhoto="";
    creatorPhotoBusy=false;
    screen="create";
    render();

  }else if(action==="load-slot"){

    currentSlot=Number(el.dataset.slot);
    screen="dashboard";
    render();

  }else if(action==="copy-slot"){

    const from=Number(el.dataset.slot);

    const empty=DB.slots.findIndex(
      (x,i)=>!x && i!==from
    );

    if(empty===-1){
      toast("Tidak ada slot kosong.");
      return;
    }

    DB.slots[empty]=
      JSON.parse(
        JSON.stringify(DB.slots[from])
      );

    DB.slots[empty].slot=empty;

    save();
    render();

  }else if(action==="delete-slot"){

    const index=Number(el.dataset.slot);

    if(confirm("Hapus save slot ini?")){

      DB.slots[index]=null;

      save();
      render();

    }

  }else if(action==="cancel-create"){

    currentSlot=null;
    creatorPhoto="";
    screen="slots";
    render();

  }else if(action==="navigate"){

    navigate(el.dataset.target);

  }else if(action==="mobile-menu"){

    mobileMenu=!mobileMenu;
    render();

  }else if(action==="slots"){

    currentSlot=null;
    screen="slots";
    render();

  }else if(action==="logout"){

    logoutGame();

  }else if(action==="advance-day"){

    advanceDay();

  }else if(action==="start-match"){

    startMatch();

  }else if(action==="match-choice"){

    matchChoice(Number(el.dataset.choice));

  }else if(action==="train"){

    trainStat(el.dataset.stat);

  }else if(action==="rest"){

    takeRest(el.dataset.rest);

  }else if(action==="buy-business"){

    buyBusiness(el.dataset.business);

  }else if(action==="upgrade-business"){

    upgradeBusiness(el.dataset.business);

  }else if(action==="like-post"){

    const s=S();

    const p=s.social.posts.find(
      x=>x.id===el.dataset.post
    );

    if(p){
      p.likes++;
      s.social.likes++;
      save();
      render();
    }

  }else if(action==="share-post"){

    const s=S();

    const p=s.social.posts.find(
      x=>x.id===el.dataset.post
    );

    if(p){

      p.shares++;
      s.social.followers+=
        Math.floor(5+Math.random()*20);

      save();
      render();

      toast("Post dibagikan.");

    }

  }else if(action==="gacha"){

    gacha();

  }else if(action==="open-partner"){

    openPartner(Number(el.dataset.index));

  }else if(action==="partner-action"){

    partnerAction(
      Number(el.dataset.index),
      el.dataset.type
    );

  }else if(action==="marry"){

    marryPartner(Number(el.dataset.index));

  }else if(action==="breakup"){

    breakupPartner(Number(el.dataset.index));

  }else if(action==="partner-edit"){

    openPartner(Number(el.dataset.index));

  }else if(action==="have-child"){

    haveChild(Number(el.dataset.index));

  }else if(action==="raise-child"){

    raiseChild(Number(el.dataset.index));

  }else if(action==="equip-border"){

    equipBorder(el.dataset.border);

  }else if(action==="generate-transfers"){

    generateTransfers();

  }else if(action==="accept-transfer"){

    acceptTransfer(Number(el.dataset.index));

  }else if(action==="toggle-god"){

    toggleGodMode();

  }else if(action==="admin-borders"){

    adminUnlockBorders();

  }else if(action==="admin-achievements"){

    adminUnlockAchievements();

  }else if(action==="admin-partners"){

    adminUnlockPartners();

  }else if(action==="admin-money"){

    adminAddMoney(Number(el.dataset.value));

  }else if(action==="admin-followers"){

    adminAddFollowers(Number(el.dataset.value));

  }else if(action==="admin-fame"){

    adminAddFame(Number(el.dataset.value));

  }else if(action==="reset-current"){

    resetCurrentSave();

  }else if(action==="close-modal"){

    closeModal();

  }

});

/* ==========================================================
   FORM DELEGATION
   ========================================================== */

document.addEventListener("submit",async event=>{

  const form=event.target;

  if(form.id==="loginForm"){

    event.preventDefault();

    const input=document.getElementById("loginEmail");

    const email=input.value.trim().toLowerCase();

    if(!email){
      toast("Masukkan email.");
      return;
    }

    DB.email=email;
    DB.logged=true;

    DB.isAdmin=
      ADMIN_EMAILS.includes(email);

    save();

    screen="slots";

    render();

    if(DB.isAdmin){
      toast("Account loaded.");
    }

    return;
  }

  if(form.id==="characterForm"){

    event.preventDefault();

    await createCharacter();

    return;
  }

  if(form.id==="profileForm"){

    saveProfile(event);

    return;
  }

  if(form.id==="postForm"){

    createPost(event);

    return;
  }

  if(form.id==="adminCoreForm"){

    applyAdminCore(event);

    return;
  }

  if(form.id==="adminStatsForm"){

    applyAdminStats(event);

    return;
  }

  if(form.id==="partnerEditForm"){

    savePartnerEdit(event);

    return;
  }

});

/* ==========================================================
   PHOTO UPLOAD
   ========================================================== */

document.addEventListener("change",async event=>{

  const input=event.target;

  if(input.id!=="createPhoto")return;

  const file=input.files && input.files[0];

  if(!file)return;

  const status=document.getElementById("creatorStatus");
  const preview=document.getElementById("createPreview");
  const submit=document.getElementById("createSubmit");

  creatorPhotoBusy=true;
  creatorPhoto="";

  if(submit){
    submit.disabled=true;
  }

  if(status){
    status.className="notice";
    status.textContent="Memproses foto...";
  }

  try{

    const data=await makePhotoDataURL(
      file,
      500,
      .72
    );

    creatorPhoto=data;

    if(preview){

      preview.innerHTML=`

        <div class="center">

          <div class="avatar border-gold" style="margin:auto">
            <img src="${creatorPhoto}" alt="preview">
          </div>

          <br>

          <div class="small">
            Foto siap digunakan.
          </div>

        </div>

      `;

    }

    if(status){
      status.className="notice success";
      status.textContent="Foto berhasil diproses. Character siap dibuat.";
    }

  }catch(error){

    console.error(error);

    creatorPhoto="";

    if(status){
      status.className="notice danger";
      status.textContent="Foto gagal diproses. Coba gambar JPG/PNG/WebP lain.";
    }

    if(preview){
      preview.innerHTML=`
        <div class="small muted center">
          Upload foto lain.
        </div>
      `;
    }

  }finally{

    creatorPhotoBusy=false;

    if(submit){
      submit.disabled=false;
    }

  }

});

/* ==========================================================
   PARTNER PHOTO UPLOAD
   ========================================================== */

document.addEventListener("change",async event=>{

  const input=event.target;

  if(!input.dataset.partnerPhoto)return;

  const index=Number(
    input.dataset.partnerPhoto
  );

  const s=S();

  const p=s.partners[index];

  if(!p)return;

  const file=input.files && input.files[0];

  if(!file)return;

  try{

    p.photo=await makePhotoDataURL(
      file,
      400,
      .7
    );

    save();

    closeModal();

    render();

    toast("Partner photo updated.");

  }catch(err){

    console.error(err);

    toast("Foto partner gagal diproses.");

  }

});

/* ==========================================================
   CHARACTER CREATION
   ========================================================== */

async function createCharacter(){

  if(creatorPhotoBusy){

    toast("Tunggu foto selesai diproses.");

    return;
  }

  if(!creatorPhoto){

    toast("Upload foto avatar terlebih dahulu.");

    return;
  }

  if(currentSlot===null){

    toast("Save slot tidak ditemukan.");

    return;
  }

  const nameEl=document.getElementById("createName");
  const ageEl=document.getElementById("createAge");
  const countryEl=document.getElementById("createCountry");
  const bgEl=document.getElementById("createBackground");
  const posEl=document.getElementById("createPosition");

  if(!nameEl||!ageEl||!countryEl||!bgEl||!posEl){

    toast("Character Creator gagal dimuat. Refresh halaman.");

    return;
  }

  const name=nameEl.value.trim();

  const age=Number(ageEl.value);

  if(!name){

    toast("Nama karakter wajib diisi.");

    nameEl.focus();

    return;
  }

  if(!Number.isFinite(age)||age<16||age>60){

    toast("Umur harus antara 16 sampai 60.");

    ageEl.focus();

    return;
  }

  const player=createPlayer(currentSlot);

  player.email=DB.email;

  player.player.name=name;
  player.player.age=age;
  player.player.country=countryEl.value.trim()||"Indonesia";
  player.player.background=bgEl.value;
  player.player.position=posEl.value;
  player.player.photo=creatorPhoto;

  player.football.club="Jakarta Rising";

  DB.slots[currentSlot]=player;

  save();

  log("Character berhasil dibuat.");

  screen="dashboard";

  const createdSlot=currentSlot;

  creatorPhoto="";
  creatorPhotoBusy=false;

  render();

  toast(`Character ${name} berhasil dibuat di Slot ${createdSlot+1}.`);
}

/* ==========================================================
   START
   ========================================================== */

render();

</script>
