function uid(prefix="id"){
 return prefix+"_"+Math.random().toString(36).slice(2,9)+"_"+Date.now().toString(36)
}

function pick(arr){
 return arr[Math.floor(Math.random()*arr.length)]
}

function chance(percent){
 return Math.random()*100<percent
}

function clamp(n,min,max){
 return Math.max(min,Math.min(max,n))
}

function money(n){
 return "$"+Math.floor(n||0).toLocaleString("en-US")
}

function esc(v){
 return String(v??"")
  .replace(/[&<>"']/g,x=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[x]))
}

function avg(obj){
 const vals=Object.values(obj);
 return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)
}

}

document.addEventListener("change",async e=>{

 if(e.target.id==="createPhoto"){

  const file=e.target.files[0];

  if(!file)return;

  pendingPlayerPhoto=await compressImage(file);

  const preview=document.getElementById("createPreview");

   preview.innerHTML=`
    <div class="avatar border-gold" style="margin:auto">
     <img src="${pendingPlayerPhoto}">
    </div>
   `
  }
 }

});

function compressImage(file){

 return new Promise(resolve=>{

  const reader=new FileReader();

  reader.onload=e=>{

   const img=new Image();

   img.onload=()=>{

    const max=600;

    const scale=Math.min(
     1,
     max/Math.max(img.width,img.height)
    );

    const canvas=document.createElement("canvas");

    canvas.width=Math.round(img.width*scale);
    canvas.height=Math.round(img.height*scale);

    canvas
     .getContext("2d")
     .drawImage(
      img,
      0,
      0,
      canvas.width,
      canvas.height
     );

    resolve(
     canvas.toDataURL(
      "image/jpeg",
      .76
     )
    );

   };

   img.src=e.target.result;

  };

  reader.readAsDataURL(file)

 })
}

 const s=S();

 if(!s.godMode&&s.football.energy<15){

  showToast("Energy kurang. Gunakan Rest Center.");

  return
 }

 const st=s.football.stats;

 let ability=0;

 if(type==="pass"){
  ability=
   st.passing*.45+
   st.vision*.35+
   st.mentality*.2
 }

 if(type==="dribble"){
  ability=
   st.dribbling*.45+
   st.pace*.3+
   st.mentality*.25
 }

 if(type==="shoot"){
  ability=
   st.shooting*.55+
   st.mentality*.25+
   st.pace*.2
 }

 if(type==="assist"){
  ability=
   st.vision*.45+
   st.passing*.4+
   st.dribbling*.15
 }

 const opponent=pick(CLUBS);

 let successChance;

 if(s.godMode){
  successChance=99
 }else{
  successChance=clamp(
   ability-opponent.power*.22+35,
   5,
   92
  )
 }

 const success=chance(successChance);

 let result;

 if(success){

  const great=
   s.godMode
   ? chance(55)
   : chance(28);

  result=great?"MOMENT":"GOOD";

 }else{

  result=chance(55)?"AVERAGE":"BAD";

 }

 if(!s.godMode){
  s.football.energy=
   clamp(
    s.football.energy-15,
    0,
    100
   )
 }

 s.football.appearances++;
 s.football.week++;

 let reward=0;

 if(result==="MOMENT"){

  reward=1800;

  s.football.wins++;

  s.football.form=
   clamp(s.football.form+8,0,100);

  s.stats.fame+=5;

  s.social.followers+=
   Math.floor(50+Math.random()*400);

  if(type==="shoot"){
   s.football.goals++;
  }

  if(type==="assist"||type==="pass"){
   s.football.assists++;
  }

  addLog(
   `MATCH MOMENT! ${type.toUpperCase()} berhasil besar.`
  );

 }else if(result==="GOOD"){

  reward=900;

  s.football.wins++;

  s.football.form=
   clamp(s.football.form+4,0,100);

  s.stats.fame+=2;

  if(type==="shoot"&&chance(55)){
   s.football.goals++;
  }

  if(type==="assist"&&chance(60)){
   s.football.assists++;
  }

  addLog("Performa bagus di pertandingan.");

 }else if(result==="AVERAGE"){

  reward=350;

  s.football.draws++;

  s.football.form=
   clamp(s.football.form-1,0,100);

  addLog("Pertandingan berjalan cukup seimbang.");

 }else{

  reward=100;

  s.football.losses++;

  s.football.form=
   clamp(s.football.form-7,0,100);

  addLog("Performa buruk. Media mulai bertanya.");

 }

 s.economy.cash+=
  reward+
  s.football.salary;

 const multiplier=
  result==="MOMENT"?1.08:
  result==="BAD"?.97:
  1.015;

 s.football.marketValue=
  Math.max(
   1000,
   Math.round(
    s.football.marketValue*multiplier
   )
  );

 advanceDay(1);

 checkAchievements();

 randomEvent();

 save();

 render();

 showToast(
  `${result} · ${money(reward)} reward`
 );

}

function buyBusiness(id){

 const s=S();

 const b=BUSINESSES.find(x=>x.id===id);

 if(!b)return;

 if(s.economy.cash<b.cost){

  showToast("Cash tidak cukup.");

  return
 }

 if(s.economy.businesses.some(x=>x.id===id)){

  showToast("Business sudah dimiliki.");

  return
 }

 s.economy.cash-=b.cost;

 s.economy.businesses.push({
  ...b,
  level:1
 });

 s.economy.weeklyIncome+=b.income;

 addLog(
  `Membeli ${b.name}.`
 );

 checkAchievements();

 save();

 render();

}

function upgradeBusiness(id){

 const s=S();

 const b=s.economy.businesses.find(
  x=>x.id===id
 );

 if(!b)return;

 const cost=
  Math.round(
   b.cost*.35*b.level
  );

 if(s.economy.cash<cost){

  showToast("Cash kurang.");

  return
 }

 s.economy.cash-=cost;

 s.economy.weeklyIncome-=
  b.income*b.level;

 b.level++;

 s.economy.weeklyIncome+=
  b.income*b.level;

 addLog(
  `${b.name} upgraded ke level ${b.level}.`
 );

 save();

 render();

}

function collectBusiness(id){

 const s=S();

 const b=s.economy.businesses.find(
  x=>x.id===id
 );

 if(!b)return;

 let income=
  b.income*b.level;

 if(chance(b.risk)){

  income=
   Math.round(income*.35);

  addLog(
   `${b.name} terkena market downturn.`
  );

 }

 s.economy.cash+=income;

 advanceDay(7);

 addLog(
  `${b.name} menghasilkan ${money(income)}.`
 );

 save();

 render();

}

function gacha(count){

 const s=S();

 const cost=
  count===10
  ?9000
  :1000;

 if(s.economy.cash<cost){

  showToast("Cash tidak cukup.");

  return
 }

  const rolled=rollPartner();

   s.partners.find(
    p=>p.id===rolled.id
   );

     owned.affection+8,

    );

   results.push(

   );

   const copy=
    JSON.parse(
     JSON.stringify(rolled)
    );

   copy.affection=
    10+
    Math.floor(Math.random()*10);

   s.partners.push(copy);

   results.push(

function rollPartner(){

 let total=
  RARITIES.reduce(
   (a,b)=>a+b.weight,
   0
  );

 let roll=Math.random()*total;

 let selected="B";

 for(const rarity of RARITIES){

  roll-=rarity.weight;

  if(roll<=0){

   selected=rarity.id;

   break
  }
 }

function partnerAction(id,action){

 const s=S();

 const p=
  s.partners.find(
   x=>x.id===id
  );

 if(!p)return;

 if(action==="chat"){

  p.affection=
   clamp(
    p.affection+
    (chance(78)?3:-1),
    0,
    100
   );

  p.trust=
   clamp(
    p.trust+1,
    0,
    100
   );

  p.arc++;

  addLog(
   `Chat dengan ${p.name}.`
  );

 }

 if(action==="date"){

  if(s.economy.cash<500){

   showToast("Date membutuhkan $500.");

   return
  }

  s.economy.cash-=500;

  p.affection=
   clamp(
    p.affection+8,
    0,
    100
   );

  p.trust=
   clamp(
    p.trust+4,
    0,
    100
   );

  p.happiness=
   clamp(
    p.happiness+7,
    0,
    100
   );

  p.jealousy=
   clamp(
    p.jealousy-2,
    0,
    100
   );

  p.arc++;

  addLog(
   `Date bersama ${p.name}.`
  );

 }

 if(action==="support"){

  p.affection=
   clamp(
    p.affection+5,
    0,
    100
   );

  p.trust=
   clamp(
    p.trust+7,
    0,
    100
   );

  s.stats.fame++;

  addLog(
   `Kamu mendukung karier ${p.name}.`
  );

 }

 if(action==="argue"){

  p.affection=
   clamp(
    p.affection-8,
    0,
    100
   );

  p.trust=
   clamp(
    p.trust-5,
    0,
    100
   );

  p.jealousy=
   clamp(
    p.jealousy+10,
    0,
    100
   );

  addLog(
   `Kamu bertengkar dengan ${p.name}.`
  );

 }

 p.status=
  p.married
  ?"married"
  :p.affection>=50
  ?"dating"
  :"single";

 save();

 openPartner(id);

}

function marryPartner(id){

 const s=S();

 const p=
  s.partners.find(
   x=>x.id===id
  );

 if(!p)return;

 if(p.married){

  showToast("Partner sudah menikah denganmu.");

  return
 }

 if(
  p.affection<80||
  p.trust<65
 ){

  showToast(
   "Butuh Affection 80 dan Trust 65."
  );

  return
 }

 if(s.economy.cash<10000){

  showToast(
   "Wedding membutuhkan $10K."
  );

  return
 }

 s.economy.cash-=10000;

 p.married=true;
 p.status="married";
 p.affection=100;
 p.trust=100;
 p.happiness=100;

 s.stats.happiness=
  clamp(
   s.stats.happiness+12,
   0,
   100
  );

 s.stats.fame+=5;

 addLog(
  `Menikah dengan ${p.name}.`
 );

 checkAchievements();

 save();

 openPartner(id);

}

function checkAchievements(){

  urhunter:s.partners.some(x=>x.rarity==="UR"),

  business:s.economy.businesses.length>=3,

  empire:s.economy.businesses.length>=BUSINESSES.length,

  followers:s.social.followers>=1000000,

  trophy:s.football.trophies>=1

 for(const a of ACHIEVEMENTS){

   s.stats.fame+=2;

}

function setOVRDirect(target){

 const s=S();

 const keys=
  Object.keys(s.football.stats);

 const current=
  avg(s.football.stats);

 const delta=
  target-current;

 keys.forEach(key=>{

  s.football.stats[key]=
   clamp(
    Math.round(
     s.football.stats[key]+delta
    ),
    1,
    99
   );

 });

 /* Final correction so displayed OVR follows target as closely
    as mathematically possible with integer stats. */

 let safety=0;

 while(
  avg(s.football.stats)!==target&&
  safety<500
 ){

  safety++;

  const currentOVR=
   avg(s.football.stats);

  const direction=
   target>currentOVR
   ?1
   :-1;

  const key=
   pick(keys);

  s.football.stats[key]=
   clamp(
    s.football.stats[key]+direction,
    1,
    99
   );

 }

}

function advanceDay(days=1){

 const s=S();

 for(let i=0;i<days;i++){

  s.calendar.day++;

  if(s.calendar.day>30){

   s.calendar.day=1;
   s.calendar.month++;

   /* business passive income */

   const income=
    s.economy.businesses.reduce(
     (total,b)=>
      total+
      b.income*b.level,
     0
    );

   if(income){

    s.economy.cash+=income;

    addLog(
     `Passive business income: ${money(income)}.`
    );

   }

   if(s.calendar.month>12){

    s.calendar.month=1;
    s.calendar.year++;

    startNewSeason();

   }

  }

  /* Relationship background simulation */

  if(s.partners.length){

   const p=pick(s.partners);

   if(p.jealousy>65&&chance(15)){

    p.affection=
     clamp(
      p.affection-2,
      0,
      100
     );

    addLog(
     `${p.name} merasa cemburu.`
    );

   }

  }

  /* Children aging */

  s.children.forEach(c=>{

   if(c.age>0&&chance(3)){
    c.education=
     clamp(c.education+1,0,100)
   }

  });

 }

 randomNews();

 checkAchievements();

 save();

}

 ){

  s.stats.fame+=10;

  addLog(

 }

 s.football.contractYears=

  );

  `Season ${s.football.season} dimulai.`
 );

}

   RENDER
------------------------- */

function render(){

 let output="";

 if(screen==="landing"){
  output=landing();
 }else if(screen==="slots"){
  output=slotsScreen();
 }else{

  const pages={

   dashboard:dashboardScreen,

   football:footballScreen,

   training:trainingScreen,

   rest:restScreen,

   transfer:transferScreen,

   business:businessScreen,

   social:socialScreen,

   partners:partnersScreen,

   relationship:relationshipScreen,

   family:familyScreen,

   inventory:inventoryScreen,

   achievements:achievementsScreen,

   news:newsScreen,

   events:eventsScreen,

   profile:profileScreen,

   admin:adminScreen,

   gdd:gddScreen

  };

  output=
   shell(
    pages[screen]
    ?pages[screen]()
    :""
   );

 }

 document.getElementById("app").innerHTML=
  output;

}

render();
