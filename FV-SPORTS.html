columns:repeat(2,minmax(0,1fr));gap:12px}.fullrow{grid-column:1/-1}.item{padding:11px;border:1px solid #27344d;border-radius:12px;background:#0a101b}.list{display:grid;gap:8px}.notice{padding:13px;border:1px solid #293755;border-radius:13px;background:#11192a}.success{background:#0d2920;border-color:#286e54}.danger{background:#29131c;border-color:#722a43}.center{text-align:center}.kpi{min-height:105px}.kpilabel{color:#78869f;font-size:9px;font-weight:900;letter-spacing:.7px}.kpin{margin-top:5px;font-size:25px;font-weight:1000}.progress{height:9px;overflow:hidden;border-radius:999px;background:#080c15}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7658ff,#27dcff)}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #202b41;text-align:left;font-size:11px}th{color:#77859e}.modalbg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:15px;background:#000c;backdrop-filter:blur(8px)}.modal{width:min(1000px,100%);max-height:92vh;overflow:auto;padding:20px;border:1px solid #34425f;border-radius:22px;background:#0c1321;box-shadow:0 40px 120px #000}.toast{position:fixed;right:18px;bottom:18px;z-index:200;max-width:400px;padding:13px 16px;border:1px solid #3b4a69;border-radius:13px;background:#121a2b;box-shadow:var(--shadow)}.logoBall{font-size:54px}.match{font-size:42px;font-weight:1000}.comment{padding:10px;border-left:2px solid #34435f;background:#0a101b;border-radius:8px}.chat{height:390px;overflow:auto;padding:12px;background:#070b14;border:1px solid #26334d;border-radius:14px}.bubble{max-width:78%;padding:10px 12px;border-radius:14px;margin:7px 0}.me{margin-left:auto;background:#3c2b93}.them{background:#172137}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:62px;padding:7px;border:1px solid #25314a;border-radius:9px;background:#0a101b}.day.matchday{border-color:#27dcff}.day.today{box-shadow:0 0 0 2px #7658ff66 inset}.trophy{width:56px;heig function uid(p="id"){return p+"_"+Math.random().toString(36).slice(2,8)+Date.now().toString(36)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(n,a,b){return Math.max(a,Math.min(b,Number(n)||0))}
function esc(v){return String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function money(n){return "$"+Math.floor(Number(n)||0).toLocaleString("en-US")}
function dateObj(s){return new Date(s.cal.y,s.cal.m-1,s.cal.d)}
function dateStr(s){return dateObj(s).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})}
function daysInMonth(y,m){return new Date(y,m,0).getDate()}
function ovr(p){return Math.round(Object.values(p.stats).reduce((a,b)=>a+b,0)/Object.values(p.stats).length)}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
function toast(x){let e=document.getElementById("toast");e.textContent=x;e.classList.remove("hidden");clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.add("hidden"),2600)}
function log(x){let s=S();s.logs.unshift("["+dateStr(s)+"] "+x);s.logs=s.logs.slice(0,180)}
function S(){return DB.slots[DB.active]}

function makeClub(name,league){
 let meta=LEAGUE_META[league]||{country:"International",continent:"Europe"};
 return {id:uid("club"),name,league,country:meta.country,continent:meta.continent,rating:68+Math.floor(Math.random()*24),budget:15000000+Math.floor(Math.random()*300000000),stadium:name+" Stadium",manager:"Manager",squad:[],trophies:[],sponsor:pick(SPONSORS)[0]};
}
const CLUBS=Object.entries(LEAGUES).flatMap(([league,names])=>names.map(n=>makeClub(n,league)));
function clubByName(n){return CLUBS.find(c=>c.name===n)}
function leagueClubs(l){return CLUBS.filter(c=>c.league===l)}

function genSquad(club){
 const first=["Alex","Mateo","Luca","Noah","Leo","Milan","Kai","Adam","Rafael","Daniel","Omar","Ethan","Jude","Hugo","Yuki","Kenji","Arda","Nico","Thiago","Mason"];

 return Array.from({length:23},(_,i)=>({id:uid("pl"),name:first[i%first.length]+" "+last[(i*3)%last.length],age:18+(i%17),pos:pos[i],ovr:62+((club.rating+i*3)%30),value:500000+(i*700000)+(club.rating*25000),salary:3000+i*900,club:club.name,custom:false}));
}
CLUBS.forEach(c=>c.squad=genSquad(c));

let screen="dashboard", mobile=false, modalState=null, match=null;

function nav(id,label){return `<button class="nav ${screen===id?"on":""}" data-a="nav" data-screen="${id}">${label}</button>`}
function shell(content){
 const s=S();
 return `<header class="top"><div class="row"><button class="btn mobile" data-a="mobile">☰</button><div class="brand">RV <b>LIFE</b> <span class="tag">2026</span></div></div>

 </aside><main class="main">${content}</main></div>`;
}

function kpi(a,b,c){return `<div class="card kpi"><div class="kpilabel">${a}</div><div class="kpin">${b}</div><div class="small muted">${c}</div></div>`}

 const s=S(), c=clubByName(s.player.club)||CLUBS[0];

function nextMatchCard(){

}

function calendarScreen(){
 const s=S(), d=dateObj(s), first=new Date(s.cal.y,s.cal.m-1,1).getDay(), n=daysInMonth(s.cal.y,s.cal.m), cells=[];

}
function startMatch(){
 let s=S(),c=clubByName(s.player.club)||CLUBS[0],r=leagueClubs(c.league).filter(x=>x.name!==c.name),opp=r[(s.football.matchday-1)%r.length];
 if(s.player.energy<18){toast("Energy tidak cukup.");return}
 s.player.energy-=18;match={opp,minute:1,home:0,away:0,actions:0,goals:0,assists:0};log("Match dimulai vs "+opp.name);render();
}
function matchScreen(){
 let s=S(),m=match,choices=[["Quick Pass","passing","assist"],["Dribble","dribbling","goal"],["Power Shot","shooting","goal"],["Hold Position","mentality","safe"]];
 return `<div class="card"><div class="between"><span class="tag">LIVE MATCH</span><span class="tag">${m.minute}'</span></div><br><div class="scoreboard"><div>${esc(s.player.club)} vs ${esc(m.opp.name)}</div><div class="match">${m.home} : ${m.away}</div><div class="small muted">Action ${m.actions+1}/6</div></div><br><div class="grid g2">${choices.map((c,i)=>`<button class="btn choice" data-a="match-choice" data-i="${i}"><b>${c[0]}</b><br><span class="small muted">${c[1].toUpperCase()} • risk/reward</span></button>`).join("")}</div></div>`;
}
function matchChoice(i){
 let s=S(),m=match,choices=[["passing","assist"],["dribbling","goal"],["shooting","goal"],["mentality","safe"]],c=choices[i],chanceP=48+(s.player.stats[c[0]]-50)*1.15-(m.opp.rating-(clubByName(s.player.club)?.rating||70))*.25;
 if(Math.random()*100<chanceP){if(c[1]==="goal"){m.home++;s.football.goals++;m.goals++;s.player.form=clamp(s.player.form+3,0,100);log("GOAL! "+s.player.name+" mencetak gol.")}else if(c[1]==="assist"){s.football.assists++;m.assists++;log("Assist untuk "+s.player.name)}else{log("Positioning sangat rapi.")}}else{if(Math.random()<.28)m.away++;s.player.form=clamp(s.player.form-1,0,100);log("Aksi gagal.")}m.actions++;m.minute+=12+Math.floor(Math.random()*12);if(m.actions>=6||m.minute>=90)finishMatch();else render();
}
function finishMatch(){let s=S(),m=match;if(m.home>m.away){s.football.wins++;s.finance.cash+=5000;log("Menang "+m.home+"-"+m.away+".")}else if(m.home===m.away){s.football.draws++;s.finance.cash+=2200;log("Imbang "+m.home+"-"+m.away+".")}else{s.football.losses++;log("Kalah "+m.home+"-"+m.away+".")}s.football.appearances++;s.football.matchday++;if(s.football.matchday>38){s.football.matchday=1;advanceDaysInternal(18);log("Musim liga selesai. Kompetisi berikutnya dimulai.")}match=null;save();render();toast("Match selesai.");}

function sponsor(name){let s=S();if(s.finance.sponsors.some(x=>x.name===name)){toast("Sponsor sudah aktif.");return}let weekly=500+Math.floor(ovr(s.player)*30)+Math.floor(Math.random()*2500);s.finance.sponsors.push({name,weekly,type:"Player Endorsement"});s.finance.weekly+=weekly;log("Sponsor deal signed: "+name);save();render()}

function socialScreen(){
 let s=S();return `<div class="hero"><div class="tag">RV-GRAM</div><h1>Your feed, your rules.</h1><p class="muted">Own posts now have real comment threads, replies, reactions and share counts.</p></div><br><div class="grid g4">${kpi("FOLLOWERS",s.social.followers.toLocaleString(),"Followers")}${kpi("LIKES",s.social.likes.toLocaleString(),"Likes")}${kpi("POSTS",s.social.posts.length,"Your posts")}${kpi("COMMENTS",s.social.posts.reduce((a,p)=>a+(p.comments||[]).length,0),"Thread comments")}</div><br><div class="card"><h2>Create Post</h2><form id="postForm"><textarea id="postText" rows="3" maxlength="500" placeholder="What's happening?"></textarea><br><button class="btn primary">Publish</button></form></div><br><div class="list">${s.social.posts.map(p=>`<div class="card"><div class="between"><b>${esc(s.player.name)}</b><span class="tiny muted">${esc(p.date)}</span></div><p>${esc(p.text)}</p><div class="row"><button class="btn" data-a="like-post" data-id="${p.id}">♥ ${p.likes}</button><button class="btn" data-a="comments" data-id="${p.id}">💬 ${(p.comments||[]).length}</button><button class="btn" data-a="share" data-id="${p.id}">↗ ${p.shares||0}</button></div></div>`).join("")||`<div class="card notice">Belum ada post.</div>`}</div>`;
}
function createPost(e){e.preventDefault();let s=S(),t=document.getElementById("postText").value.trim();if(!t)return;s.social.posts.unshift({id:uid("post"),text:t,date:dateStr(s),likes:Math.floor(5+Math.random()*30),shares:0,comments:[]});s.social.followers+=Math.floor(5+Math.random()*50);log("New RV-Gram post published.");save();render()}
function commentsModal(id){let s=S(),p=s.social.posts.find(x=>x.id===id);if(!p)return;modal(`<div class="between"><h2>Comments</h2><button class="btn" data-a="close">×</button></div><p>${esc(p.text)}</p><div class="list">${(p.comments||[]).map((c,i)=>`<div class="comment"><b>${esc(c.user)}</b><div>${esc(c.text)}</div><div class="tiny muted">♥ ${c.likes||0}</div></div>`).join("")||`<div class="notice">Belum ada komentar.</div>`}</div><br><textarea id="commentText" placeholder="Write a comment or reply..."></textarea><br><button class="btn primary full" data-a="comment-add" data-id="${id}">Comment</button>`)}
function addComment(id){let s=S(),p=s.social.posts.find(x=>x.id===id),t=document.getElementById("commentText").value.trim();if(!p||!t)return;p.comments.push({id:uid("com"),user:pick(["Fan United","Football Daily","Rising Star","Anonymous Fan","Club Insider"]),text:t,likes:Math.floor(Math.random()*10)});s.social.likes+=2;save();commentsModal(id)}

function partnerData(){let s=S();if(!s.relationship.partners.length)s.relationship.partners.push({id:uid("par"),name:"Alya",age:22,job:"Content Creator",personality:"Warm & Loyal",affection:35,trust:50,jealousy:10,happiness:70,energy:80,status:"dating",married:false,children:[],chat:[]});return s.relationship.partners}
function partnersScreen(){
 let ps=partnerData();return `<div class="hero"><div class="tag">PARTNER AI</div><h1>Talk. Don't just press a stat button.</h1><p class="muted">Setiap partner punya personality, affection, trust, jealousy, happiness, status dan conversation memory. Chat engine ini berjalan lokal tanpa API key.</p></div><br><div class="grid g2">${ps.map((p,i)=>`<div class="card"><div class="between"><div><span class="tag">${esc(p.personality)}</span><h2>${esc(p.name)}</h2><div class="small muted">${esc(p.job)} • ${p.status}</div></div><div class="big">${p.affection}</div></div><br>${bar("Affection",p.affection)}${bar("Trust",p.trust)}${bar("Happiness",p.happiness)}<br><button class="btn cyan full" data-a="chat-partner" data-i="${i}">Open AI Chat</button></div>`).join("")}</div>`;
}
function chatModal(i){let s=S(),p=s.relationship.partners[i];if(!p)return;if(!s.chat[i])s.chat[i]=[];let msgs=s.chat[i];modal(`<div class="between"><div><span class="tag">${esc(p.personality)}</span><h2>${esc(p.name)}</h2><div class="small muted">Affection ${p.affection} • Trust ${p.trust} • Jealousy ${p.jealousy}</div></div><button class="btn" data-a="close">×</button></div><div id="chatbox" class="chat">${msgs.map(m=>`<div class="bubble ${m.me?"me":"them"}">${esc(m.text)}</div>`).join("")||`<div class="notice">Conversation baru dimulai.</div>`}</div><br><div class="row"><input id="chatInput" placeholder="Type a message..."><button class="btn primary" data-a="chat-send" data-i="${i}">Send</button></div>`)}
function localAI(p,t){
 let x=t.toLowerCase(),base=p.personality.includes("Warm")?["Aku suka kalau kamu cerita langsung begini.","Aku dengerin. Jangan dipendam sendiri."]:p.personality.includes("Ambitious")?["Kalau kamu serius, aku mau lihat kamu konsisten.","Kariermu penting, tapi jangan lupa hubungan ini juga butuh waktu."]:["Hmm, menarik. Ceritain lebih jauh.","Aku punya pendapat sendiri, tapi aku mau dengar versi kamu dulu."];
 if(x.includes("love")||x.includes("sayang")||x.includes("cinta"))return p.affection>60?"Aku juga sayang kamu. Jangan cuma bilang, tunjukkan lewat tindakan.":"Aku senang dengarnya. Kita jalan pelan-pelan, ya.";
 if(x.includes("transfer")||x.includes("club"))return "Kalau kamu pindah klub, aku cuma minta satu hal: jangan hilang kabar.";
 if(x.includes("marry")||x.includes("nikah"))return p.affection>=70?"Aku bisa membayangkan masa depan itu.":"Kita belum sampai sana. Bangun trust kita dulu.";
 if(x.includes("jealous"))return p.jealousy>45?"Sedikit. Aku nggak mau bohong soal itu.":"Aku percaya kamu, jadi nggak perlu drama.";
 return pick(base);
}
function chatSend(i){let s=S(),p=s.relationship.partners[i],inp=document.getElementById("chatInput"),t=inp.value.trim();if(!t)return;if(!s.chat[i])s.chat[i]=[];s.chat[i].push({me:true,text:t});let reply=localAI(p,t);s.chat[i].push({me:false,text:reply});p.affection=clamp(p.affection+(t.length>20?2:1),0,100);p.trust=clamp(p.trust+1,0,100);save();chatModal(i)}

function familyScreen(){
 let s=S();return `<div class="hero"><div class="tag">FAMILY SIMULATION</div><h1>Raise the next generation.</h1><p class="muted">Lebih banyak interaksi anak: school, play, train, gift, talk dan family day.</p></div><br><div class="card"><button class="btn primary" data-a="new-child">Have a Child</button></div><br><div class="grid g3">${s.relationship.children.map((c,i)=>`<div class="card"><h2>${esc(c.name)}</h2><div class="small muted">Age ${c.age}</div><br>${bar("Development",c.development)}${bar("Education",c.education)}${bar("Health",c.health)}${bar("Bond",c.bond)}<br><div class="grid g2"><button class="btn green" data-a="child-action" data-i="${i}" data-type="play">Play</button><button class="btn cyan" data-a="child-action" data-i="${i}" data-type="study">Study</button><button class="btn orange" data-a="child-action" data-i="${i}" data-type="gift">Gift</button><button class="btn" data-a="child-action" data-i="${i}" data-type="talk">Talk</button></div></div>`).join("")||`<div class="card notice fullrow">Belum ada anak.</div>`}</div>`;
}
function newChild(){let s=S(),name=prompt("Nama anak:","Baby "+(s.relationship.children.length+1));if(name===null)return;s.relationship.children.push({id:uid("child"),name:name.trim()||"Baby",age:0,development:10,education:5,health:90,bond:70});log("Anak "+name+" masuk ke keluarga.");save();render()}
function childAction(i,type){let s=S(),c=s.relationship.children[i];if(!c)return;let effects={play:[5,0,1,5],study:[2,7,0,3],gift:[1,0,3,4],talk:[2,2,0,6]}[type];c.development=clamp(c.development+effects[0],0,100);c.education=clamp(c.education+effects[1],0,100);c.health=clamp(c.health+effects[2],0,100);c.bond=clamp(c.bond+effects[3],0,100);advanceDaysInternal(1);log("Family activity: "+type+" bersama "+c.name);save();render()}

function awardsScreen(){let s=S();return `<div class="hero"><div class="tag">TROPHY ROOM</div><h1>Names that mean something.</h1><p class="muted">Trophy names use real competition/award names. Visual trophy shapes are rendered with CSS so this remains one HTML file.</p></div><br><div class="grid g4">${(s.football.trophies.length?s.football.trophies:["FIFA World Cup","UEFA Champions League","Premier League","Ballon d'Or","Golden Boot"]).map((x,i)=>`<div class="card center"><div class="trophy">🏆</div><h3>${esc(x)}</h3><div class="small muted">${i%2?"Player Award":"Competition Trophy"}</div></div>`).join("")}</div><br><div class="card"><h2>Available Awards</h2><div class="grid g3">${AWARDS.map(x=>`<div class="item">★ ${esc(x)}</div>`).join("")}</div></div>`}

function newsScreen(){let s=S();return `<div class="hero"><div class="tag">RV WORLD NEWS</div><h1>The world keeps moving.</h1><p class="muted">News muncul dari simulasi tanggal, transfer, sponsor, hasil pertandingan dan perkembangan dunia.</p></div><br><div class="list">${s.world.news.map(n=>`<div class="card"><h3>${esc(n.title)}</h3><div class="small muted">${esc(n.date)}</div></div>`).join("")||`<div class="card notice">Belum ada berita. Advance time untuk membuat dunia bergerak.</div>`}</div>`}
function guideScreen(){return `<div class="hero"><div class="tag">ARCHITECTURE</div><h1>Single-file professional sandbox.</h1><p class="muted">Semua UI, CSS, data, game logic dan save system berada di file ini. Tidak ada npm, build step atau framework.</p></div><br><div class="grid g2"><div class="card"><h2>What is inside?</h2><div class="list">${["Real-world club directory snapshot","Continents & countries","National teams + 2026 World Cup directory","Domestic / continental / world competitions","Calendar with real month lengths","Transfer market","Club ownership & custom players","Real-world sponsor names","Post comments & threads","Partner contextual chat","Children interactions","Local autosave"].map(x=>`<div class="item">✓ ${x}</div>`).join("")}</div></div><div class="card"><h2>Important technical note</h2><p class="muted">Satu HTML bisa jadi game client-side yang besar dan playable. Untuk AI LLM sungguhan, multiplayer, live football APIs, cloud save dan secure authentication, kamu butuh backend. Jangan taruh API key rahasia di HTML publik GitHub.</p><p class="small muted">Versi ini sengaja tetap playable offline dan aman untuk GitHub Pages.</p></div></div>`}
function profileScreen(){let s=S();return `<div class="hero"><div class="tag">PLAYER PROFILE</div><h1>Edit your identity.</h1></div><br><div class="card"><form id="profileForm"><div class="formgrid"><div><label>Name</label><input id="pname" value="${esc(s.player.name)}"></div><div><label>Age</label><input id="page" type="number" value="${s.player.age}"></div><div><label>Country</label><input id="pcountry" value="${esc(s.player.country)}"></div><div><label>Position</label><select id="ppos">${["GK","CB","LB","RB","DMF","CMF","AMF","LW","RW","ST"].map(x=>`<option ${x===s.player.position?"selected":""}>${x}</option>`).join("")}</select></div></div><br><button class="btn primary">Save</button></form></div>`}
function savesScreen(){return `<div class="hero"><div class="tag">SAVE SLOTS</div><h1>Three careers.</h1></div><br><div class="grid g3">${DB.slots.map((s,i)=>`<div class="card"><h2>Slot ${i+1}</h2><p class="small muted">${s?esc(s.player.name)+" • "+esc(s.player.club):"Empty"}</p>${s?`<button class="btn primary full" data-a="load-slot" data-i="${i}">Load</button><br><br><button class="btn red full" data-a="delete-slot" data-i="${i}">Delete</button>`:`<button class="btn primary full" data-a="new-slot" data-i="${i}">Create</button>`}</div>`).join("")}</div>`}

function render(){
 let content={dashboard:dashboard,calendar:calendarScreen,world:worldScreen,clubs:()=>clubsScreen(""),national:nationalScreen,competitions:competitionsScreen,football:footballScreen,training,transfer:transferScreen,business:businessScreen,myclub:myClubScreen,players:playersScreen,clubmarket:clubMarket,sponsors:sponsorsScreen,social:socialScreen,partners:partnersScreen,family:familyScreen,awards:awardsScreen,news:newsScreen,guide:guideScreen,profile:profileScreen,saves:savesScreen}[screen]();
 document.getElementById("app").innerHTML=shell(content);mobile=false;
}
function modal(x){let e=document.getElementById("modal");e.innerHTML='<div class="modal">'+x+'</div>';e.classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden");document.getElementById("modal").innerHTML=""}

function advanceDaysInternal(days){
 let s=S();for(let z=0;z<days;z++){s.cal.d++;s.player.energy=clamp(s.player.energy+2,0,100);if(s.cal.d>daysInMonth(s.cal.y,s.cal.m)){s.cal.d=1;s.cal.m++;s.finance.cash+=s.finance.weekly*4;if(s.cal.m>12){s.cal.m=1;s.cal.y++;s.football.season=(s.cal.y)+"/"+String((s.cal.y+1)).slice(2)}s.relationship.children.forEach(c=>{if(Math.random()<.12){c.age++;c.education=clamp(c.education+1,0,100)}})}if(s.finance.businesses.length)s.finance.cash+=s.finance.businesses.reduce((a,b)=>a+b.revenue*b.level,0)/30;if(Math.random()<.16)worldNews()}}
function advanceDays(n=1){advanceDaysInternal(n);save();render();toast("Waktu maju "+n+" hari.")}
function worldNews(){let s=S(),c=pick(CLUBS);let templates=[`${c.name} mengumumkan perkembangan besar menjelang pertandingan berikutnya.`,`Sponsor global mulai mencari wajah baru untuk kampanye berikutnya.`,`Transfer window memanas setelah rumor pemain bintang.`,`Kompetisi ${pick(CLUB_COMP)[0]} memasuki fase penting.`,`Pelatih ${c.name} menyiapkan perubahan taktik.`];s.world.news.unshift({title:pick(templates),date:dateStr(s)});s.world.news=s.world.news.slice(0,30)}

document.addEventListener("click",e=>{
 let b=e.target.closest("[data-a]");if(!b)return;let a=b.dataset.a;
 if(a==="nav"){screen=b.dataset.screen;closeModal();render()}
 else if(a==="mobile"){mobile=!mobile;render()}
 else if(a==="advance")advanceDays(+b.dataset.days||1)
 else if(a==="start-match")startMatch()
 else if(a==="match-choice")matchChoice(+b.dataset.i)
 else if(a==="train")train(b.dataset.stat)
 else if(a==="offers")offers()
 else if(a==="accept")acceptTransfer(+b.dataset.i)
 else if(a==="club")clubModal(b.dataset.club)
 else if(a==="league"){screen="clubs";render()}
 else if(a==="national")nationalModal(b.dataset.national)
 else if(a==="new-business")newBusiness()
 else if(a==="create-biz")createBiz()
 else if(a==="upgrade-biz"){let s=S(),x=s.finance.businesses[+b.dataset.i];if(x){s.finance.cash-=x.revenue*2;x.level++;x.revenue=Math.floor(x.revenue*1.35);save();render()}}
 else if(a==="sponsor")sponsor(b.dataset.name)
 else if(a==="comments")commentsModal(b.dataset.id)
 else if(a==="comment-add")addComment(b.dataset.id)
 else if(a==="like-post"){let p=S().social.posts.find(x=>x.id===b.dataset.id);if(p){p.likes++;S().social.likes++;save();render()}}
 else if(a==="share"){let p=S().social.posts.find(x=>x.id===b.dataset.id);if(p){p.shares++;S().social.followers+=3;save();render()}}
 else if(a==="chat-partner")chatModal(+b.dataset.i)
 else if(a==="chat-send")chatSend(+b.dataset.i)
 else if(a==="new-child")newChild()
 else if(a==="child-action")childAction(+b.dataset.i,b.dataset.type)
 else if(a==="close")closeModal()
 else if(a==="club-buy")screen="clubmarket",render()
 else if(a==="club-create-player")createPlayerModal()
 else if(a==="edit-player")createPlayerModal(+b.dataset.i)
 else if(a==="save-created-player")saveCreatedPlayer(b.dataset.i)
 else if(a==="club-train"){let c=S().football.ownedClub;if(c){c.players.forEach(p=>p.ovr=clamp(p.ovr+1,40,99));c.rating=clamp(c.rating+1,1,99);save();render();toast("Squad trained.")}}
 else if(a==="club-sponsor"){S().football.ownedClub.sponsor=pick(SPONSORS)[0];save();render()}
 else if(a==="buy-player")buyPlayer(b.dataset.player)
 else if(a==="month"){let s=S();s.cal.m=clamp(s.cal.m+(+b.dataset.d),1,12);save();render()}
 else if(a==="load-slot"){DB.active=+b.dataset.i;if(!DB.slots[DB.active])DB.slots[DB.active]=fresh();save();screen="dashboard";render()}
 else if(a==="new-slot"){DB.slots[+b.dataset.i]=fresh();DB.active=+b.dataset.i;save();screen="dashboard";render()}
 else if(a==="delete-slot"){if(confirm("Delete slot?")){DB.slots[+b.dataset.i]=null;save();render()}}
});
document.addEventListener("submit",e=>{
 if(e.target.id==="postForm")createPost(e);
 if(e.target.id==="profileForm"){e.preventDefault();let s=S();s.player.name=document.getElementById("pname").value.trim()||"Player";s.player.age=+document.getElementById("page").value||18;s.player.country=document.getElementById("pcountry").value.trim()||"Indonesia";s.player.position=document.getElementById("ppos").value;save();render();toast("Profile saved.")}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
</script>
</body>
</html>
