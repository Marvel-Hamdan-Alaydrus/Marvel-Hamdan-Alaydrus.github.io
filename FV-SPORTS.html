<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>RV LIFE: Simulator Ultra Pro Max</title>

<style>
:root{
  --bg:#060b13;
  --bg2:#0b1320;
  --panel:#101b2b;
  --panel2:#142237;
  --line:#263954;
  --text:#eef5ff;
  --muted:#8fa4be;
  --accent:#5ee7ff;
  --accent2:#7c5cff;
  --good:#35e38b;
  --warn:#ffc857;
  --bad:#ff5c7a;
  --gold:#ffd86b;
  --shadow:0 20px 60px rgba(0,0,0,.35);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 15% 10%,rgba(94,231,255,.09),transparent 28%),
radial-gradient(circle at 85% 20%,rgba(124,92,255,.11),transparent 28%),
var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:inherit}
#app{min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{
  width:245px;position:fixed;left:0;top:0;bottom:0;z-index:20;
  background:rgba(7,14,24,.95);border-right:1px solid var(--line);
  padding:18px;overflow:auto;backdrop-filter:blur(20px)
}
.logo{font-size:22px;font-weight:900;letter-spacing:-.8px;margin-bottom:4px}
.logo span{color:var(--accent)}
.version{font-size:11px;color:var(--muted);margin-bottom:22px}
.nav{display:grid;gap:7px}
.nav button{
  width:100%;text-align:left;background:transparent;border:1px solid transparent;
  color:#b9c8db;padding:11px 12px;border-radius:12px
}
.nav button:hover,.nav button.active{background:#142238;border-color:#29415f;color:white}
.main{margin-left:245px;width:calc(100% - 245px);min-width:0}
.topbar{
  position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 20px;background:rgba(6,11,19,.84);
  border-bottom:1px solid var(--line);backdrop-filter:blur(18px)
}
.datebox{font-weight:800}.datebox small{display:block;color:var(--muted);font-weight:500}
.resource-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{padding:7px 10px;border:1px solid var(--line);background:#0d1827;border-radius:999px;font-size:12px}
.page{padding:20px;max-width:1600px;margin:auto}
.hero{
  background:linear-gradient(135deg,rgba(94,231,255,.12),rgba(124,92,255,.10));
  border:1px solid #28415e;border-radius:24px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px
}
.hero h1{margin:0 0 7px;font-size:clamp(24px,4vw,42px);letter-spacing:-1.5px}
.hero p{color:var(--muted);max-width:850px;margin:0;line-height:1.6}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
  background:linear-gradient(180deg,rgba(20,34,55,.96),rgba(13,24,39,.96));
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.18)
}
.card h2,.card h3{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.big{font-size:28px;font-weight:900}
.btn{
  border:1px solid #31506f;background:#172942;color:white;border-radius:11px;
  padding:10px 13px;font-weight:800;transition:.15s
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.primary{background:linear-gradient(135deg,#19b9d8,#6c5cff);border-color:transparent}
.btn.good{background:#123f31;border-color:#216c51}
.btn.warn{background:#443719;border-color:#765d1e}
.btn.bad{background:#461b29;border-color:#713046}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:#9eb2c9;font-weight:700}
.field input,.field select,.field textarea{
  width:100%;border:1px solid #2b415e;background:#091523;color:white;
  border-radius:10px;padding:11px;outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
textarea{min-height:100px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-grid .full{grid-column:1/-1}
.progress{height:8px;border-radius:99px;background:#07101b;overflow:hidden;border:1px solid #1e3148}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.statline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.avatar{
  width:72px;height:72px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:#17273d;border:4px solid #8b6945;font-size:30px;flex:none
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.ovr-green{border-color:#39db8b}
.avatar.ovr-silver{border-color:#c8d0dc}
.avatar.ovr-gold{border-color:#ffd75d}
.avatar.ovr-elite{border-color:#8b5cff;box-shadow:0 0 0 3px #00eaff,0 0 28px rgba(124,92,255,.7);animation:pulse 2s infinite}
.avatar.ovr-goat{border-color:#ff5ee7;box-shadow:0 0 0 3px #ffd45c,0 0 35px rgba(255,94,231,.8);animation:orbit 2.8s linear infinite}
@keyframes pulse{50%{filter:brightness(1.3);box-shadow:0 0 0 6px rgba(0,234,255,.15),0 0 35px rgba(124,92,255,.9)}}
@keyframes orbit{50%{transform:rotate(2deg) scale(1.04)}}
.profile-head{display:flex;gap:14px;align-items:center}
.rarity{font-size:11px;font-weight:900;padding:4px 7px;border-radius:6px;background:#202b3d}
.rarity.UR{background:#5d1f61;color:#ff8cff}.rarity.SSS{background:#273f8d;color:#a9d8ff}
.rarity.SS{background:#6a4a15;color:#ffe18c}.rarity.S{background:#324f35;color:#8cffad}
.rarity.A{background:#294255;color:#8fd8ff}.rarity.B{background:#29313b;color:#b7c1cb}
.list{display:grid;gap:8px}
.list-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px;border:1px solid #253a54;border-radius:12px;background:#0b1726
}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:10px;border-bottom:1px solid #21344c;text-align:left;font-size:13px}
th{color:#9eb2c9;background:#0c1827;position:sticky;top:0}
.trophy{
  width:68px;height:78px;position:relative;margin:auto;
}
.trophy:before{
  content:"";position:absolute;left:20px;top:8px;width:28px;height:40px;
  border:6px solid var(--gold);border-top-left-radius:4px;border-top-right-radius:4px;
  background:linear-gradient(90deg,#b9821d,#ffe994,#c28c1c)
}
.trophy:after{
  content:"";position:absolute;left:28px;bottom:9px;width:12px;height:23px;
  background:var(--gold);box-shadow:0 19px 0 5px #b47d18
}
.trophy .handle1,.trophy .handle2{
  position:absolute;top:11px;width:20px;height:28px;border:5px solid var(--gold);border-radius:50%
}
.trophy .handle1{left:2px}.trophy .handle2{right:2px}
.modal-root{position:fixed;inset:0;z-index:100;pointer-events:none}
.modal-root.open{pointer-events:auto}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(7px)}
.modal{
  position:relative;z-index:1;width:min(900px,calc(100% - 24px));max-height:calc(100vh - 24px);
  overflow:auto;margin:12px auto;background:#0c1726;border:1px solid #304967;border-radius:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.55);padding:20px
}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:200;background:#13243a;border:1px solid #365271;
  border-radius:12px;padding:12px 15px;box-shadow:var(--shadow);max-width:360px
}
.login{
  min-height:100vh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(circle at center,rgba(94,231,255,.09),transparent 35%),var(--bg)
}
.login-card{width:min(560px,100%);padding:30px;border:1px solid #29415e;border-radius:25px;background:#0c1726;box-shadow:var(--shadow)}
.login-card h1{font-size:42px;letter-spacing:-2px;margin:0 0 8px}
.slot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.slot{
  min-height:190px;border:1px dashed #38506d;background:#0c1828;border-radius:18px;padding:18px;
  display:flex;flex-direction:column;justify-content:space-between
}
.kpi{font-size:11px;color:#8fa4be;text-transform:uppercase;letter-spacing:.8px}
.badge-admin{color:#07101b;background:linear-gradient(90deg,#ffe269,#ff9f43);padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}
.comment{
  border-left:3px solid #365271;padding:8px 10px;background:#0a1421;border-radius:0 10px 10px 0
}
.feed-post{display:grid;gap:10px}
.tag{display:inline-block;padding:4px 7px;border-radius:6px;background:#1a2c44;color:#9fd8ff;font-size:11px}
.calendar{
  display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:5px;overflow:auto
}
.day{
  min-height:120px;background:#0b1726;border:1px solid #223750;border-radius:10px;padding:7px
}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(94,231,255,.2)}
.event{
  font-size:10px;padding:4px;margin-top:4px;border-radius:5px;background:#192d47;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.event.match{background:#3a2130}.event.social{background:#18382e}.event.date{background:#3c2844}.event.business{background:#34321d}
.empty{padding:30px;text-align:center;color:var(--muted)}
.notice{padding:11px 13px;border:1px solid #29415e;background:#0c1929;border-radius:12px;color:#b9c8db;margin-bottom:12px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media(max-width:1000px){
 .sidebar{width:74px;padding:10px}.sidebar .logo,.sidebar .version,.nav button span{display:none}
 .nav button{text-align:center;font-size:18px;padding:12px 5px}.main{margin-left:74px;width:calc(100% - 74px)}
 .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
 .topbar{align-items:flex-start;flex-direction:column}.resource-row{justify-content:flex-start}
 .page{padding:12px}.g2,.g3,.g4,.form-grid,.slot-grid{grid-template-columns:1fr}
 .hero{padding:18px}.hero h1{font-size:28px}.calendar{grid-template-columns:repeat(7,110px)}
}
</style>
</head>

function makeStats(ovr){
  return {
    pace:clamp(ovr-3+rand(-4,4),35,99),
    shooting:clamp(ovr+rand(-5,4),35,99),
    passing:clamp(ovr+rand(-4,5),35,99),
    dribbling:clamp(ovr+rand(-4,5),35,99),
    defending:clamp(ovr-7+rand(-5,5),25,99),
    physical:clamp(ovr-2+rand(-5,5),30,99),
    stamina:clamp(ovr+rand(-5,4),30,99),
    mentality:clamp(ovr+rand(-5,5),30,99)
  };
}

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function uid(prefix="id"){return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function money(n){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Math.max(0,n))}
function num(n){return new Intl.NumberFormat("id-ID").format(Math.round(n||0))}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function nowDate(){return new Date(game.world.year,game.world.month-1,game.world.day)}
function dateKey(y,m,d){return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function monthName(m){return new Date(2000,m-1,1).toLocaleString("id-ID",{month:"long"})}
function formatDate(){
  return nowDate().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})
}
function chance(p){
  if(currentPlayer()?.godMode)return Math.random()<.99;
  return Math.random()<p;
}

function calcOvr(p){
  if(p?.manualOvr!=null)return clamp(Number(p.manualOvr)||1,1,99);
  const s=p.stats||{};
  const vals=Object.values(s);
  return clamp(Math.round(vals.reduce((a,b)=>a+b,0)/Math.max(vals.length,1)),1,99);
}
function ovrClass(ovr){
  if(ovr<60)return "ovr-brown";
  if(ovr<70)return "ovr-green";
  if(ovr<80)return "ovr-silver";
  if(ovr<90)return "ovr-gold";
  if(ovr<96)return "ovr-elite";
  return "ovr-goat";
}

function generatePartners(){
  const out=[];
  let id=1;
  for(const country of PARTNER_COUNTRIES){
    for(const rarity of RARITIES){
      for(let i=0;i<PARTNER_COUNTS[rarity];i++){
        const pool=NAME_POOL[country];
        const first=pool[(i+id)%pool.length];
        const last=["Lunara","Velin","Arden","Kaya","Mirel","Aster","Nova","Rena"][(i*3+id)%8];
        const rarityOvr={UR:95,SSS:90,SS:84,S:78,A:70,B:62}[rarity];
        out.push({
          id:"partner_"+id,
          name:first+" "+last,
          age:20+((i+id)%14),
          country,
          occupation:JOBS[(i+id)%JOBS.length],
          rarity,
          personality:PERSONALITIES[(i+id)%PERSONALITIES.length],
          photo:"",
          border:"Starter",
          affection:15+rand(0,12),
          trust:10+rand(0,15),
          jealousy:10+rand(0,20),
          mood:70,
          ovr:rarityOvr+rand(-2,3),
          money:1000000+rarityOvr*250000,
          inventory:["Phone","Signature Outfit"],
          memories:[],
          married:false,
          relationshipStatus:"single",
          children:[],
          arc:0,
          unlocked:false
        });
        id++;
      }
    }
  }
  return out;
}

function buildClubSquads(){
  CLUBS.forEach(c=>{
    const matching=REAL_PLAYERS.filter(p=>p.club===c.name).map(clone);
    c.squad=matching;
    if(!c.squad.length){
      const count=18;
      for(let i=0;i<count;i++){
        const base=clamp(c.rating+rand(-9,7),55,91);
        c.squad.push({
          id:uid("squad"),name:fakePlayerName(c.country,i),country:c.country,
          club:c.name,position:["GK","CB","RB","LB","DM","CM","AM","RW","LW","ST"][i%10],
          ovr:base,potential:clamp(base+rand(0,12),base,96),age:18+rand(0,17),
          value:base*1000000,salary:base*3000,stats:makeStats(base),form:70,morale:75,injury:0
        });
      }
    }
  });
  NATIONAL_TEAMS.forEach(nt=>{
    nt.squad=REAL_PLAYERS.filter(p=>p.country===nt.name).map(clone);
    for(let i=nt.squad.length;i<23;i++){
      const base=clamp(nt.rating+rand(-9,6),55,91);
      nt.squad.push({
        id:uid("ntsquad"),name:fakePlayerName(nt.name,i),country:nt.name,
        club:"National Team",position:["GK","CB","RB","LB","DM","CM","AM","RW","LW","ST"][i%10],
        ovr:base,potential:clamp(base+rand(1,10),base,96),age:18+rand(0,16),
        value:base*1000000,salary:0,stats:makeStats(base),form:70,morale:75,injury:0
      });
    }
  });
}

}

function renderCalendar(){
  const start=new Date(game.world.year,game.world.month-1,1);
  const days=new Date(game.world.year,game.world.month,0).getDate();
  const first=(start.getDay()+6)%7;
  const cells=[];
  for(let i=0;i<first;i++)cells.push(`<div></div>`);
  for(let d=1;d<=days;d++){
    const key=dateKey(game.world.year,game.world.month,d);
    const ev=game.world.events.filter(x=>x.date===key);
    cells.push(`<div class="day ${d===game.world.day?"today":""}">

      ${ev.map(eventHTML).join("")}

  return `<div class="hero">
    <div class="tag">TIME ENGINE</div>
    <h1>${monthName(game.world.month)} ${game.world.year}</h1>

    <div class="calendar">${["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(x=>`<div class="muted small">${x}</div>`).join("")}${cells.join("")}</div>

/* =========================
   CALENDAR ENGINE
   ========================= */

function getUpcomingEvents(days){
  const result=[];
  let d=new Date(game.world.year,game.world.month-1,game.world.day);
  for(let i=0;i<days;i++){
    const key=dateKey(d.getFullYear(),d.getMonth()+1,d.getDate());
    result.push(...game.world.events.filter(x=>x.date===key));
    d.setDate(d.getDate()+1);
  }
  return result;
}

function scheduleEvent(offset,title,kind,meta={}){
  const d=new Date(game.world.year,game.world.month-1,game.world.day);
  d.setDate(d.getDate()+offset);
  const event={id:uid("event"),date:dateKey(d.getFullYear(),d.getMonth()+1,d.getDate()),title,kind,...meta};
  game.world.events.push(event);
  return event;
}

function seedSeasonEvents(){
  const existing=new Set(game.world.events.map(x=>x.title+"|"+x.date));
  for(let i=3;i<=120;i+=7){
    const club=CLUBS[rand(0,CLUBS.length-1)];
    const opponent=CLUBS[rand(0,CLUBS.length-1)];
    if(opponent.name===club.name)continue;
    const d=new Date(game.world.year,game.world.month-1,game.world.day);
    d.setDate(d.getDate()+i);
    const date=dateKey(d.getFullYear(),d.getMonth()+1,d.getDate());
    const title=`${club.name} vs ${opponent.name}`;
    if(!existing.has(title+"|"+date)){
      game.world.events.push({id:uid("event"),date,title,kind:"match",club:club.name,opponent:opponent.name});
    }
  }
  ["Sponsor Meeting","Business Strategy","Family Day","Recovery Session","Media Day"].forEach((x,i)=>{
    scheduleEvent(2+i*10,x,["business","business","date","social","social"][i]);
  });
}

function consumeEnergy(n){
  if(game.player.godMode)return true;
  if(game.player.energy<n){

    return false;
  }
  game.player.energy-=n;

}

function buyRest(cost,energy){
  const p=game.player;
  if(p.money<cost)return toast("Uang tidak cukup.");
  p.money-=cost;
  p.energy=clamp(p.energy+energy,0,100);
  p.health=clamp(p.health+8,0,100);
  advanceDayCore(1,false);
  closeModal();toast(`Rest selesai. Energy ${p.godMode?"∞":p.energy}.`);
}

function training(){
  const p=game.player;
  if(!consumeEnergy(18))return;
  const keys=Object.keys(p.stats);
  const a=keys[rand(0,keys.length-1)],b=keys[rand(0,keys.length-1)];
  p.stats[a]=clamp(p.stats[a]+rand(1,3),1,99);
  p.stats[b]=clamp(p.stats[b]+1,1,99);
  p.career.form=clamp(p.career.form+rand(1,4),0,100);
  p.money-=Math.min(p.money,100000);
  scheduleEvent(1,"Training Session","social");
  advanceDayCore(1,false);
  saveGame();render();toast(`Training selesai. ${a} meningkat.`);
}

function playMatch(){
  const p=game.player;
  if(!consumeEnergy(25))return;
  const success=chance(.68);
  const o=calcOvr(p);
  const opponent=CLUBS[rand(0,CLUBS.length-1)];
  const attackScore=clamp((p.stats.shooting+p.stats.dribbling+p.stats.passing)/3+rand(-15,15),30,99);
  const performance=clamp(Math.round(attackScore+(success?rand(2,12):rand(-12,2))),1,99);
  let goals=0,assists=0;
  if(performance>=80)goals=rand(0,3);
  else if(performance>=65)goals=rand(0,1);
  if(performance>=72&&chance(.55))assists=1;

  const reward=500000+performance*35000+goals*700000;
  p.money+=reward;
  p.fame+=Math.max(1,Math.round(performance/15));
  p.followers+=Math.max(5,performance*rand(2,5));
  p.career.matches++;
  p.career.goals+=goals;
  p.career.assists+=assists;
  p.career.form=clamp(Math.round((p.career.form+performance)/2),0,100);
  p.career.value=Math.round(p.career.value*(1+performance/10000+goals/1000));
  advanceDayCore(1,false);

  openModal(`<div class="tag">MATCH RESULT</div>
  <h1>${esc(p.career.club)} vs ${esc(opponent.name)}</h1>
  <div class="grid g3">${kpi("Performance",performance)}${kpi("Goals",goals)}${kpi("Assists",assists)}</div>
  <hr>
  <div class="notice">${success?"Match momentum berpihak kepadamu.":"Pertandingan berat, tapi pengalaman bertambah."}</div>
  <div class="list">${info("Match Reward",money(reward))}${info("Fame", "+"+Math.max(1,Math.round(performance/15)))}${info("Followers","+"+Math.max(5,performance*rand(2,5)))}</div>
  <button class="btn primary" data-action="closeModal">Continue</button>`);
  saveGame();
  render();
}

function advanceDayCore(days=1,doRender=true){
  for(let i=0;i<days;i++){
    const d=new Date(game.world.year,game.world.month-1,game.world.day);
    d.setDate(d.getDate()+1);
    game.world.year=d.getFullYear();
    game.world.month=d.getMonth()+1;
    game.world.day=d.getDate();

    if(game.world.day===1&&game.world.month===7){
      game.world.season=`${game.world.year}/${String(game.world.year+1).slice(-2)}`;
      game.player.career.season=game.world.year;
      game.player.energy=clamp(game.player.energy+30,0,100);
    }

    game.player.health=clamp(game.player.health+1,0,100);
    game.player.career.form=clamp(game.player.career.form+rand(-1,2),0,100);

    game.player.business.companies.forEach(c=>{
      c.cash+=c.revenue;
      c.revenue=Math.round(c.revenue*(.995+Math.random()*.015));
      c.profit=Math.round(c.revenue*.38);
      c.valuation=Math.round(c.valuation+c.profit*.15);
      game.player.business.cash+=c.profit;
    });

    game.player.children.forEach(c=>{
      if(game.world.day===c.birthDay&&game.world.month===c.birthMonth)c.age++;
      c.health=clamp(c.health+rand(-1,2),0,100);
      c.education=clamp(c.education+((c.age>5)?rand(0,1):0),0,100);
    });

    game.player.partners.forEach(x=>{
      x.mood=clamp(x.mood+rand(-3,3),0,100);
      if(x.mood<35)x.affection=clamp(x.affection-1,0,100);
    });

    const today=game.world.events.find(e=>e.date===dateKey(game.world.year,game.world.month,game.world.day));
    if(today&&today.kind==="match")game.player.career.form=clamp(game.player.career.form+2,0,100);
  }
  game.world.lastAdvance=Date.now();
  if(doRender){saveGame();render();}
}

function gachaPartner(){
  const p=game.player;
  const cost=2500000;
  if(p.money<cost)return toast("Uang tidak cukup untuk gacha.");
  p.money-=cost;

  const weights={UR:1,SSS:3,SS:8,S:18,A:30,B:40};
  const roll=Math.random()*100;
  let rarity="B",acc=0;
  for(const r of RARITIES){
    acc+=weights[r];
    if(roll<=acc){rarity=r;break}
  }
  const pool=PARTNER_CATALOG.filter(x=>x.rarity===rarity);
  const template=clone(pool[rand(0,pool.length-1)]);
  template.id=uid("partner");
  template.unlocked=true;
  template.memories=["Pertemuan pertama di RV LIFE."];
  p.partners.push(template);
  saveGame();render();
  openPartner(template);
}

function aiReply(p,msg){
  const lower=msg.toLowerCase();
  let reply="";
  if(/capek|lelah|tired|exhaust/.test(lower)){
    reply=p.personality==="protective"
      ?"Istirahat dulu. Jangan maksain diri cuma karena kamu pengin selalu kuat."
      :"Kamu habis latihan lagi ya? Cerita dong, hari ini bagian paling berat apa?";
  }else if(/menang|gol|match|pertandingan/.test(lower)){
    reply="Aku ikut seneng. Tapi jangan cuma cerita hasilnya, aku pengin tahu kamu tadi mainnya gimana.";
  }else if(/sayang|cinta|love|kangen|rindu/.test(lower)){
    reply=p.personality==="romantic"
      ?"Aku juga kepikiran kamu. Jangan bikin aku senyum sendirian begini."
      :"Hehe, kamu tiba-tiba manis banget. Ada maunya nih?";
  }else if(/uang|bisnis|sponsor/.test(lower)){
    reply="Kamu memang lagi sibuk banget sama karier dan bisnis. Aku dukung, asal jangan sampai aku cuma dapat sisa waktu.";
  }else if(/anak|family|keluarga/.test(lower)){
    reply="Kalau soal keluarga, aku pengin kita benar-benar hadir, bukan cuma punya status keluarga.";
  }else if(/maaf|sorry/.test(lower)){
    reply=p.trust>65
      ?"Aku terima permintaan maafmu. Tapi aku perlu lihat tindakanmu juga."
      :"Aku dengar. Kasih aku waktu sedikit untuk tenang.";
  }else{
    const pool=[
      `Aku dengerin. Menurut kamu sendiri, ${p.personality==="ambitious"?"apa langkah berikutnya?":"apa yang paling kamu rasain sekarang?"}`,
      "Ceritain lebih banyak. Aku nggak mau cuma jawab satu kalimat.",
      "Oke, aku simpan ini. Ada bagian lain yang belum kamu ceritain?",
      "Kalau aku jadi kamu, aku mungkin bakal mikir dua kali. Tapi aku pengin dengar alasanmu dulu.",
      "Hmm. Aku punya pendapat, tapi aku pengin tahu kamu sebenarnya berharap aku jawab apa."
    ];
    reply=pool[rand(0,pool.length-1)];
  }
  if(p.jealousy>70&&/pasangan|partner|date|cewek|cowok/.test(lower)){
    reply+=" Dan jangan bikin aku cemburu ya.";
  }
  return reply;
}

function openComments(id){
  const post=game.player.social.posts.find(x=>x.id===id);if(!post)return;
  openModal(`<h2>Comments</h2><div class="list">
    ${post.comments.length?post.comments.map(c=>`<div class="comment">
      <b>@${esc(c.user)}</b><div>${esc(c.text)}</div><div class="small muted">♥ ${c.likes}</div>
      <button class="btn" data-action="replyComment" data-post="${post.id}" data-comment="${c.id}">Reply</button>
      ${c.replies?.map(r=>`<div class="comment" style="margin-top:6px"><b>@${esc(r.user)}</b> ${esc(r.text)}</div>`).join("")||""}
    </div>`).join(""):`<div class="empty">No comments.</div>`}
  </div>`);
}

function replyComment(postId,commentId){
  const post=game.player.social.posts.find(x=>x.id===postId);
  const c=post?.comments.find(x=>x.id===commentId);
  if(!c)return;
  const text=prompt("Balas komentar:");
  if(!text)return;
  c.replies=c.replies||[];
  c.replies.push({user:game.player.name,text});
  saveGame();openComments(postId);
}

function signSponsor(name){
  const p=game.player;
  const fee=rand(3000000,25000000)+p.fame*100000;
  p.money+=fee;p.fame+=2;
  p.social.notifications.unshift(`Sponsor deal: ${name}`);
  saveGame();closeModal();render();toast(`${name} menawarkan deal senilai ${money(fee)}.`);
}

function adminMax(){

  p.money=999999999999;p.fame=99999;p.followers=9999999;p.energy=100;p.health=100;
  Object.keys(p.stats).forEach(k=>p.stats[k]=99);

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-action]");
  if(!b)return;
  const a=b.dataset.action;

  if(a==="closeModal"){closeModal();return}
  if(a==="nav"){game.screen=b.dataset.screen;saveGame();render();return}
  if(a==="save"){saveGame();toast("Game saved.");return}
  if(a==="logout"){game.player=null;game.screen="login";saveGame();render();return}
  if(a==="newSlot"){game.slot=Number(b.dataset.slot);game.screen="create";render();return}
  if(a==="backSlots"){game.screen="slots";render();return}
  if(a==="loadSlot"){
    const slot=Number(b.dataset.slot);
    const save=game.saves?.[slot];
    if(!save)return;
    game=clone(save);
    game.screen="dashboard";
    saveGame();render();return;
  }
  if(a==="deleteSlot"){
    const slot=Number(b.dataset.slot);
    if(!confirm("Delete save slot ini?"))return;
    if(game.saves)game.saves[slot]=null;
    localStorage.setItem(SAVE_KEY,JSON.stringify(game));
    render();return;
  }

  if(a==="advanceDay"){advanceDayCore(1,true);return}
  if(a==="quickTraining"){training();return}
  if(a==="rest"){rest();return}
  if(a==="buyRest"){buyRest(Number(b.dataset.cost),Number(b.dataset.energy));return}
  if(a==="playMatch"){playMatch();return}
  if(a==="openTransfer"){transferModal();return}
  if(a==="worldTab"){game.worldTab=b.dataset.tab;render();return}
  if(a==="clubInfo"){showClub(b.dataset.id);return}
  if(a==="nationalInfo"){showNational(b.dataset.id);return}
  if(a==="competitionInfo"){showCompetition(b.dataset.id);return}
  if(a==="scheduleCompetition"){
    for(let i=1;i<=8;i++)scheduleEvent(i*7,`${b.dataset.id.toUpperCase()} Matchday ${i}`,"match");
    saveGame();closeModal();render();toast("Season schedule generated.");return;
  }
  if(a==="prevMonth"){
    game.world.month--;if(game.world.month<1){game.world.month=12;game.world.year--}
    game.world.day=1;saveGame();render();return;
  }
  if(a==="nextMonth"){
    game.world.month++;if(game.world.month>12){game.world.month=1;game.world.year++}
    game.world.day=1;saveGame();render();return;
  }
  if(a==="today"){render();return}

  if(a==="createBusiness"){createBusiness();return}
  if(a==="businessUpgrade"){upgradeBusiness(b.dataset.id);return}
  if(a==="businessBranch"){branchBusiness(b.dataset.id);return}
  if(a==="sponsorDeals"){sponsorDeals();return}
  if(a==="signSponsor"){signSponsor(b.dataset.sponsor);return}

  if(a==="gachaPartner"){gachaPartner();return}
  if(a==="partnerCatalog"){partnerCatalog();return}
  if(a==="recruitCatalog"){recruitCatalog(b.dataset.id);return}
  if(a==="chatPartner"){chatPartner(b.dataset.id);return}
  if(a==="partnerDate"){partnerDate(b.dataset.id);return}
  if(a==="partnerProfile"){
    const p=game.player.partners.find(x=>x.id===b.dataset.id);if(p)openPartner(p);return;
  }
  if(a==="marryPartner"){marryPartner(b.dataset.id);return}
  if(a==="haveChildWith"){haveChildWith(b.dataset.id);return}
  if(a==="partnerPhoto"){partnerPhoto(b.dataset.id);return}
  if(a==="editPartner"){editPartner(b.dataset.id);return}

  if(a==="haveChild"){
    const name=prompt("Nama anak:");
    if(!name)return;
    if(game.player.money<5000000)return toast("Butuh Rp5.000.000.");
    game.player.money-=5000000;
    game.player.children.push({
      id:uid("child"),name,age:0,health:100,education:0,bond:60,
      hobby:"Exploring",talent:"Unknown",birthDay:game.world.day,birthMonth:game.world.month
    });
    saveGame();render();return;
  }
  if(a==="childAction"){childAction(b.dataset.id,b.dataset.kind);return}

  if(a==="createPost"){createPost();return}
  if(a==="likePost"){
    const post=game.player.social.posts.find(x=>x.id===b.dataset.id);
    if(post){post.likes++;game.player.likes++;saveGame();render();}
    return;
  }
  if(a==="openComments"){openComments(b.dataset.id);return}
  if(a==="replyComment"){replyComment(b.dataset.post,b.dataset.comment);return}

  if(a==="equipBorder"){
    if(game.player.inventory.borders.includes(b.dataset.border)){
      game.player.activeBorder=b.dataset.border;
      saveGame();render();toast("Border equipped.");
    }
    return;
  }
  if(a==="createOwnedClub"){createOwnedClub();return}
  if(a==="clubTransfer"){transferModal();return}
  if(a==="customPlayer"){customPlayer();return}
  if(a==="buyPlayer"){
    const pl=REAL_PLAYERS.find(x=>x.id===b.dataset.player);if(!pl)return;
    if(game.player.money<pl.value)return toast("Uang tidak cukup.");
    game.player.money-=pl.value;
    if(game.player.business.club){
      game.player.business.club.squad.push(clone(pl));
    }else{
      game.player.career.club=pl.club;
    }
    saveGame();closeModal();render();toast(`${pl.name} direkrut.`);
    return;
  }

  if(a==="toggleGod"){
    game.player.godMode=!game.player.godMode;saveGame();render();return;
  }
  if(a==="adminMax"){adminMax();return}
  if(a==="unlockAll"){unlockAll();return}
  if(a==="giveTrophy"){giveTrophy();return}
  if(a==="adminPartner"){adminPartner();return}
  if(a==="resetCurrent"){
    if(confirm("Reset karakter ini?")){
      game.player=createDefaultPlayer();game.world=freshWorld();seedSeasonEvents();
      saveGame();render();
    }
    return;
  }
});

document.addEventListener("submit",async e=>{
  e.preventDefault();

  if(e.target.id==="loginForm"){
    const email=e.target.loginEmail.value.trim().toLowerCase();
    if(!email)return;
    if(!game.saves)game.saves=[null,null,null];
    game.email=email;
    game.isAdmin=ADMIN_EMAILS.includes(email);
    game.screen="slots";
    saveGame();render();
    return;
  }

  if(e.target.id==="createForm"){
    const f=new FormData(e.target);
    const p=createDefaultPlayer();
    p.name=f.get("name").trim();
    p.age=Number(f.get("age"));
    p.gender=f.get("gender");
    p.country=f.get("country");
    p.position=f.get("position");
    p.background=f.get("background");

    const file=document.getElementById("characterPhoto")?.files?.[0];
    if(file)p.photo=await compressImage(file);

    game.player=p;
    game.world=freshWorld();
    seedSeasonEvents();
    if(!game.saves)game.saves=[null,null,null];
    game.saves[game.slot]=clone({
      version:VERSION,email:game.email,isAdmin:game.isAdmin,
      screen:"dashboard",slot:game.slot,world:game.world,player:game.player
    });
    game.screen="dashboard";
    saveGame();render();toast("Character berhasil dibuat.");
    return;
  }

  if(e.target.id==="chatForm"){
    const f=new FormData(e.target);
    partnerMessage(f.get("partnerId"),f.get("message").trim());
    return;
  }

  if(e.target.id==="businessForm"){
    const f=new FormData(e.target);
    const capital=Number(f.get("capital"));
    if(capital<=0||game.player.business.cash<capital)return toast("Business cash tidak cukup.");
    game.player.business.cash-=capital;
    const company={
      id:uid("biz"),name:f.get("name").trim(),category:f.get("category"),
      city:f.get("city"),cash:capital,level:1,employees:3,
      revenue:Math.max(100000,Math.round(capital*.03)),
      profit:Math.max(50000,Math.round(capital*.011)),
      valuation:capital*2,branches:0
    };
    game.player.business.companies.push(company);
    saveGame();closeModal();render();toast(`${company.name} resmi berdiri.`);
    return;
  }

  if(e.target.id==="ownedClubForm"){
    const f=new FormData(e.target);
    const budget=Number(f.get("budget"));
    if(game.player.business.cash<budget)return toast("Business cash tidak cukup.");
    game.player.business.cash-=budget;
    game.player.business.club={
      id:uid("ownedclub"),name:f.get("name").trim(),country:f.get("country"),
      city:f.get("city"),stadium:f.get("stadium"),color:f.get("color"),
      budget,squad:[],academy:[],value:budget
    };
    saveGame();closeModal();render();toast(`${f.get("name")} berhasil didirikan.`);
    return;
  }

  if(e.target.id==="customPlayerForm"){
    const f=new FormData(e.target);
    const pl={
      id:uid("customplayer"),name:f.get("name").trim(),age:Number(f.get("age")),
      country:f.get("country"),position:f.get("position"),ovr:Number(f.get("ovr")),
      potential:Number(f.get("potential")),value:Number(f.get("value")),salary:Number(f.get("salary")),
      club:game.player.business.club?.name||"Free Agent",stats:makeStats(Number(f.get("ovr"))),
      form:70,morale:75,injury:0
    };
    if(game.player.business.club){
      game.player.business.club.squad.push(pl);
      saveGame();closeModal();render();toast(`${pl.name} masuk squad klub.`);
    }else{
      saveGame();closeModal();toast(`${pl.name} dibuat sebagai custom player.`);
    }
    return;
  }

  if(e.target.id==="postForm"){
    const f=new FormData(e.target);
    postNow(f.get("text").trim(),f.get("tag"));
    return;
  }

  if(e.target.id==="adminForm"){
    const f=new FormData(e.target);
    game.player.money=Math.max(0,Number(f.get("money")));
    game.player.fame=Math.max(0,Number(f.get("fame")));
    game.player.followers=Math.max(0,Number(f.get("followers")));
    game.player.energy=clamp(Number(f.get("energy")),0,100);
    game.player.health=clamp(Number(f.get("health")),0,100);
    game.player.manualOvr=clamp(Number(f.get("manualOvr")),1,99);
    saveGame();render();toast("Admin values updated.");
    return;
  }
});

/* =========================
   IMAGE COMPRESSION
   ========================= */

function compressImage(file,max=720,quality=.82){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*scale));
        c.height=Math.max(1,Math.round(img.height*scale));
        const ctx=c.getContext("2d");
        ctx.drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL("image/jpeg",quality));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

   ========================= */

function syncCurrentToSlot(){
  if(!game.saves)game.saves=[null,null,null];
  if(game.player){
    game.saves[game.slot]={
      version:VERSION,email:game.email,isAdmin:game.isAdmin,
      screen:"dashboard",slot:game.slot,world:game.world,player:game.player
    };
  }
}

const originalSaveGame=saveGame;
saveGame=function(){
  syncCurrentToSlot();
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify(game));
  }catch(e){
    toast("LocalStorage penuh. Coba kurangi foto besar atau hapus save.");
  }
};

/* =========================
   MIGRATION / BOOT
   ========================= */

function migrate(){
  if(!game.saves)game.saves=[null,null,null];
  if(!game.world)game.world=freshWorld();
  if(!game.version)game.version=VERSION;

  if(game.player){
    const d=createDefaultPlayer();
    game.player={...d,...game.player};
    game.player.stats={...d.stats,...(game.player.stats||{})};
    game.player.career={...d.career,...(game.player.career||{})};
    game.player.business={...d.business,...(game.player.business||{})};
    game.player.business.companies=game.player.business.companies||[];
    game.player.partners=game.player.partners||[];
    game.player.children=game.player.children||[];
    game.player.social=game.player.social||d.social;
    game.player.social.posts=game.player.social.posts||[];
    game.player.inventory={...d.inventory,...(game.player.inventory||{})};
  }
}
migrate();

if(game.player && !game.world.events.length)seedSeasonEvents();

render();

/* autosave every 20 seconds */
