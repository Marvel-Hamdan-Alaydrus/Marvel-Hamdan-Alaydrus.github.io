<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RV LIFE: Simulator | Ultra Pro Max</title>
<style>
:root{
  --bg:#070912;--panel:#0d1220;--panel2:#12192a;--line:#26324a;
  --text:#eef4ff;--muted:#8995ad;--accent:#7c5cff;--cyan:#27d7ff;
  --green:#37e39a;--red:#ff5577;--yellow:#ffd35a;--gold:#ffb52e;
  --shadow:0 18px 50px rgba(0,0,0,.38);--radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at 20% 0%,#17123a 0,#070912 38%,#05060b 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.app{min-height:100vh}
.topbar{
 position:sticky;top:0;z-index:50;background:rgba(7,9,18,.86);
 backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07);
 display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:12px
}
.brand{font-weight:1000;letter-spacing:-.8px;font-size:19px}
.brand span{color:var(--cyan)}
.topstats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#101728;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;color:#dbe6ff}
.layout{display:flex;min-height:calc(100vh - 62px)}
.sidebar{
 width:245px;position:sticky;top:62px;height:calc(100vh - 62px);
 padding:14px;border-right:1px solid rgba(255,255,255,.06);background:rgba(8,11,20,.75);
 overflow:auto
}
.navbtn{
 width:100%;border:1px solid transparent;background:transparent;color:#aeb9cf;
 text-align:left;padding:11px 12px;border-radius:12px;margin-bottom:5px
}
.navbtn:hover,.navbtn.active{background:#141c30;color:#fff;border-color:#293653}
.main{flex:1;padding:22px;max-width:1600px;margin:auto;width:100%}
.grid{display:grid;gap:15px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
 background:linear-gradient(145deg,rgba(18,25,42,.96),rgba(10,14,25,.96));
 border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow)
}
.hero{
 padding:25px;border:1px solid #29365a;border-radius:24px;
 background:radial-gradient(circle at 90% 10%,rgba(124,92,255,.24),transparent 32%),linear-gradient(145deg,#121a31,#080c16)
}
h1,h2,h3{margin:0 0 10px}
h1{font-size:clamp(28px,4vw,48px);letter-spacing:-1.7px}
h2{font-size:22px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:12px}.big{font-size:28px;font-weight:900}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{
 border:1px solid #33405d;background:#171f34;color:#fff;border-radius:12px;padding:10px 14px;
 transition:.15s transform,.15s background
}
.btn:hover{transform:translateY(-1px);background:#202b46}
.btn.primary{background:linear-gradient(135deg,#7355ff,#4b37ce);border-color:#8069ff}
.btn.green{background:#123b30;border-color:#216f56;color:#bfffe7}
.btn.red{background:#3c1723;border-color:#762b42;color:#ffc2d0}
.btn.gold{background:#3b2a0d;border-color:#72531a;color:#ffe7a0}
.btn.cyan{background:#0d3440;border-color:#17677d;color:#c7f7ff}
.btn.full{width:100%}
input,select,textarea{
 width:100%;background:#090e19;color:#fff;border:1px solid #2a3650;border-radius:11px;
 padding:11px 12px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:#6e59ed}
label{display:block;color:#aeb9cf;font-size:12px;margin-bottom:6px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .fullrow{grid-column:1/-1}
.stat{margin:8px 0}
.statline{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.bar{height:7px;background:#080b13;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));border-radius:inherit}
.avatar{
 width:112px;height:112px;border-radius:50%;overflow:hidden;position:relative;flex:none;
 background:#151c2c;display:grid;place-items:center
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .initial{font-size:38px;font-weight:1000;color:#7583a3}
.border-brown{border:7px solid #875a35;box-shadow:0 0 0 2px #bd8552}
.border-green{border:7px solid #28bb7d;box-shadow:0 0 18px #28bb7d88}
.border-silver{border:8px solid #bfc9d9;box-shadow:0 0 20px #dce7ff77}
.border-gold{border:9px solid #ffc54d;box-shadow:0 0 24px #ffc54d99}
.border-cosmic{border:9px solid #9b76ff;box-shadow:0 0 28px #9b76ff,0 0 65px #27d7ff55;animation:pulse 2s infinite}
.border-dragon{border:10px solid #ff5577;box-shadow:0 0 22px #ff5577,0 0 60px #ff9a4d66;animation:dragon 2.2s linear infinite}
.border-star{border:10px solid #8ce9ff;box-shadow:0 0 24px #8ce9ff,0 0 55px #7c5cff;animation:spinGlow 3s linear infinite}
.border-goat{border:11px solid #fff;box-shadow:0 0 18px #fff,0 0 45px #ffd35a,0 0 80px #7c5cff;animation:goat 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.035);filter:saturate(1.35)}}
@keyframes dragon{50%{transform:rotate(2deg) scale(1.035)}}
@keyframes spinGlow{50%{filter:hue-rotate(80deg) brightness(1.35)}}
@keyframes goat{50%{transform:scale(1.055);filter:brightness(1.3)}}
.playerhead{display:flex;align-items:center;gap:18px}
.kpi{font-size:25px;font-weight:1000}.kpilabel{font-size:11px;color:var(--muted)}
.kpicard{padding:14px}
.tag{display:inline-flex;padding:5px 8px;border-radius:8px;font-size:11px;font-weight:800;background:#171f33;border:1px solid #2c3955}
.UR{color:#ff8cf0;border-color:#a03e91;background:#351638}
.SSS{color:#ffdb68;border-color:#8c691c;background:#352a0e}
.SS{color:#b58cff;border-color:#5e3bb0;background:#26183e}
.S{color:#67d8ff;border-color:#216b83;background:#102b38}
.A{color:#69f2ac;border-color:#287c59;background:#103126}
.B{color:#c1cadb;border-color:#4c566c;background:#202635}
.list{display:grid;gap:9px}
.item{padding:11px;border:1px solid #26324a;border-radius:13px;background:#0b101c}
.feedpost{padding:15px;border:1px solid #29344b;border-radius:16px;background:#0d1321}
.feedpost+.feedpost{margin-top:10px}
.toast{
 position:fixed;right:18px;bottom:18px;z-index:100;background:#121a2c;border:1px solid #39486a;
 padding:13px 16px;border-radius:13px;box-shadow:var(--shadow);max-width:360px
}
.modalwrap{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#0d1322;border:1px solid #34415e;border-radius:22px;padding:20px;box-shadow:0 30px 100px #000}
.slotcard{min-height:210px;display:flex;flex-direction:column;justify-content:space-between}
.slotempty{display:grid;place-items:center;min-height:140px;color:#66738e}
.savebadge{color:#6cf0af}
.ranktable{width:100%;border-collapse:collapse}.ranktable td,.ranktable th{text-align:left;padding:9px;border-bottom:1px solid #202b40;font-size:12px}
.raritybar{height:9px;border-radius:999px;background:#151c2b;overflow:hidden}
.raritybar i{display:block;height:100%;width:60%;background:linear-gradient(90deg,#7c5cff,#27d7ff)}
.notice{padding:12px 14px;border-radius:13px;background:#11192a;border:1px solid #293754}
.danger{border-color:#7b2942;background:#28131c}
.success{border-color:#287456;background:#0f2921}
.center{text-align:center}
.footer{text-align:center;color:#53617c;font-size:11px;padding:30px}
.mobilemenu{display:none}
@media(max-width:900px){
 .sidebar{display:none}.mobilemenu{display:block}.layout{display:block}.main{padding:13px}
 .g2,.g3,.g4,.formgrid{grid-template-columns:1fr}
 .topbar{padding:10px}.topstats{display:none}.hero{padding:18px}
}
</style>
</head>

function uid(prefix="id"){
 return prefix+"_"+Math.random().toString(36).slice(2,8)+"_"+Date.now().toString(36);
}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function money(n){return "$"+Math.floor(n||0).toLocaleString("en-US")}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function chance(p){return Math.random()*100<p}
function esc(s){
 return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;t.classList.remove("hidden");
 clearTimeout(window.__toast);
 window.__toast=setTimeout(()=>t.classList.add("hidden"),2600);
}

function makePartnerCatalog(){
 const out=[];
 COUNTRIES.forEach(country=>{
   RARITIES.forEach(r=>{
     for(let i=0;i<r.count;i++){
       const index=out.length;
       const base=country.names[i%country.names.length];
       const suffix=i>=country.names.length ? " "+(Math.floor(i/country.names.length)+1):"";
       const age=19+(index%14);
       const month=((index*7)%12)+1;
       const day=((index*11)%27)+1;
       const birth=`${2000+(index%8)}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
       out.push({
         id:`P${String(index+1).padStart(3,"0")}`,
         country:country.id,
         countryName:country.name,
         rarity:r.id,
         name:base+suffix,
         age,
         birthdate:birth,
         job:JOBS[index%JOBS.length],
         personality:PERSONALITIES[index%PERSONALITIES.length],
         affection:0,
         trust:50,
         jealousy:10,
         happiness:60,
         energy:70,
         married:false,
         children:[],
         photo:"",
         borderId:r.id==="UR"?"goat":r.id==="SSS"?"star":r.id==="SS"?"cosmic":r.id==="S"?"gold":r.id==="A"?"silver":"green",
         inventory:["Starter Gift","Personal Journal"],
         story:[
           "Kalian pertama kali bertemu lewat RV-Gram.",
           "Dia mulai membuka cerita tentang ambisinya.",

           "Sebuah keputusan besar mengubah hubungan kalian.",
           "Kalian menentukan apakah hubungan ini akan menjadi serius."
         ],
         arc:0,
         status:"single",
         notes:""
       });
     }
   });
 });
 return out;
}

const PARTNERS=makePartnerCatalog();

 return {
   slot,
   createdAt:Date.now(),
   player:{
     name:"New Player",age:18,country:"Indonesia",background:"Street Football",

     goals:0,assists:0,appearances:0,wins:0,losses:0,draws:0,

   },

     cash:10000,bank:0,weeklyIncome:0,debt:0,
     businesses:[],investments:[],sponsors:[],luxury:[]
   },
   social:{
     followers:120,following:30,likes:80,comments:10,

   },
   partners:[],
   children:[],
   inventory:{
     borders:["brown"],items:["Football Boots","Phone"],
     gifts:[],badges:[]
   },
   achievements:[],
   stats:{
     fame:0,happiness:60,health:90,discipline:55,lifestyle:40
   },

   logs:["Game dimulai. Selamat datang di RV LIFE."],

}

let DB=loadDB();
let currentSlot=null;
let screen="slots";
let modal=null;
let pendingCreatePhoto="";

function loadDB(){
 try{
   const x=JSON.parse(localStorage.getItem(KEY));
   if(x&&Array.isArray(x.slots)) return x;
 }catch(e){}
 return {slots:[null,null,null],settings:{sound:true}};
}
function saveDB(){
 localStorage.setItem(KEY,JSON.stringify(DB));
}
function S(){
 return DB.slots[currentSlot];
}
function currentOvr(){
 const s=S();if(!s)return 0;
 const vals=Object.values(s.football.stats);
 return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function borderForOvr(ovr){
 if(ovr>=99)return"goat";
 if(ovr>=97)return"star";
 if(ovr>=94)return"dragon";
 if(ovr>=91)return"cosmic";
 if(ovr>=80)return"gold";
 if(ovr>=70)return"silver";
 if(ovr>=60)return"green";
 return"brown";
}
function getBorder(id){
 return BORDERS.find(x=>x.id===id)||BORDERS[0];
}
function ensureUnlockedBorders(){
 const s=S();if(!s)return;
 BORDERS.forEach(b=>{
   if(b.need&&currentOvr()>=b.need&&!s.inventory.borders.includes(b.id))
     s.inventory.borders.push(b.id);
 });
}
function addLog(msg){
 const s=S();if(!s)return;
 s.logs.unshift(`[${s.calendar.day}/${s.calendar.month}/${s.calendar.year}] ${msg}`);
 s.logs=s.logs.slice(0,100);
}
function advanceDay(days=1){
 const s=S();
 for(let i=0;i<days;i++){
   s.calendar.day++;
   if(s.calendar.day>30){
     s.calendar.day=1;s.calendar.month++;
     if(s.calendar.month>12){s.calendar.month=1;s.calendar.year++;newSeason();}
   }
 }
}
function newSeason(){
 const s=S();
 s.football.season++;
 s.football.week=1;
 s.football.energy=100;
 s.football.form=65;
 s.football.contractYears=Math.max(0,s.football.contractYears-1);
 addLog(`Season baru dimulai. Season ${s.football.season}.`);
 randomNews();
}

 s.news=s.news.slice(0,20);
}

function navigate(x){
 screen=x;modal=null;render();
 window.scrollTo({top:0,behavior:"smooth"});
}

 if(!s)return content;
 ensureUnlockedBorders();
 const ovr=currentOvr();

 return `
 <div class="app">

}
function nav(id,label,icon){
 return `<button class="navbtn ${screen===id?"active":""}" onclick="navigate('${id}')">${icon} &nbsp; ${label}</button>`;
}
function toggleMobileNav(){
 const x=document.getElementById("sidebar");x.style.display=x.style.display==="block"?"none":"block";
}

function render(){
 let html="";
 if(screen==="slots") html=slotsScreen();
 else if(screen==="create") html=createScreen();
 else{
  const pages={
   dashboard:dashboardScreen,football:footballScreen,training:trainingScreen,
   transfer:transferScreen,business:businessScreen,social:socialScreen,
   partners:partnersScreen,relationship:relationshipScreen,family:familyScreen,
   inventory:inventoryScreen,achievements:achievementsScreen,news:newsScreen,
   gdd:gddScreen,profile:profileScreen,admin:adminScreen

}

function slotsScreen(){
 return `

document.addEventListener("change",e=>{
 if(e.target.id==="cphoto"&&e.target.files[0]){
   compressImage(e.target.files[0]).then(x=>{
    pendingCreatePhoto=x;
    document.getElementById("previewCreate").innerHTML=`<div class="avatar border-gold" style="margin:auto"><img src="${x}"></div>`;
   });
 }
});
function compressImage(file){
 return new Promise(resolve=>{
  const reader=new FileReader();
  reader.onload=e=>{
   const img=new Image();
   img.onload=()=>{
    const max=600,scale=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    resolve(c.toDataURL("image/jpeg",.78));
   };
   img.src=e.target.result;
  };
  reader.readAsDataURL(file);
 });
}

 s.player.age=+document.getElementById("cage").value;
 s.player.country=document.getElementById("ccountry").value.trim()||"Indonesia";
 s.player.background=document.getElementById("cbg").value;
 s.player.position=document.getElementById("cpos").value;
 s.player.photo=pendingCreatePhoto;
 DB.slots[currentSlot]=s;saveDB();
 screen="dashboard";toast("Karakter berhasil dibuat.");render();
}

function loadSlot(i){

function duplicateSlot(i){
 const target=DB.slots.findIndex((x,j)=>!x&&j!==i);
 if(target<0){toast("Semua slot sudah terisi.");return}
 DB.slots[target]=JSON.parse(JSON.stringify(DB.slots[i]));
 DB.slots[target].slot=target;saveDB();toast(`Slot disalin ke ${target+1}`);render();
}
function deleteSlot(i){
 if(!confirm(`Hapus Save Slot ${i+1}?`))return;
 DB.slots[i]=null;saveDB();render();
}
function backSlots(){

}

function clubPower(name){return CLUBS.find(x=>x.name===name)?.power||70}

function playMatch(type){
 const s=S();
 if(s.football.energy<15){toast("Energy terlalu rendah. Training/rest dulu.");return}
 const st=s.football.stats;
 let base=0;
 if(type==="safe")base=st.passing*.45+st.vision*.35+st.mentality*.2;
 if(type==="dribble")base=st.dribbling*.45+st.pace*.3+st.mentality*.25;
 if(type==="shoot")base=st.shooting*.55+st.mentality*.25+st.pace*.2;
 if(type==="assist")base=st.vision*.45+st.passing*.4+st.dribbling*.15;
 const opp=clubPower(pick(CLUBS).name);
 const roll=base+(Math.random()*28-14)-(opp*.12);
 let outcome;
 if(roll>=68)outcome="MOMENT";
 else if(roll>=53)outcome="GOOD";
 else if(roll>=38)outcome="AVERAGE";
 else outcome="BAD";
 s.football.appearances++;
 s.football.energy=clamp(s.football.energy-15,0,100);
 s.football.week++;
 let reward=0;
 if(outcome==="MOMENT"){
   reward=1000;s.football.form=clamp(s.football.form+8,0,100);
   s.stats.fame+=3;s.social.followers+=Math.floor(10+Math.random()*80);
   if(type==="shoot")s.football.goals++;
   if(type==="assist"||type==="safe")s.football.assists++;
   addLog(`Match sukses besar. ${type.toUpperCase()} menjadi highlight.`);
 }else if(outcome==="GOOD"){
   reward=500;s.football.form=clamp(s.football.form+3,0,100);
   s.stats.fame+=1;
   if(type==="shoot"&&chance(45))s.football.goals++;
   if(type==="assist"&&chance(50))s.football.assists++;
   addLog("Performa bagus di pertandingan.");
 }else if(outcome==="AVERAGE"){
   reward=200;s.football.form=clamp(s.football.form-1,0,100);addLog("Pertandingan berjalan biasa saja.");
 }else{
   reward=50;s.football.form=clamp(s.football.form-7,0,100);addLog("Performa mengecewakan. Media mulai bertanya.");
 }
 s.economy.cash+=reward+s.football.salary;
 s.football.marketValue=Math.round(s.football.marketValue*(1+(outcome==="MOMENT"?0.08:outcome==="BAD"?-.03:.015)));
 if(chance(25))randomNews();
 checkAchievements();
 advanceDay(1);saveDB();render();
 toast(`${outcome}: +${money(reward)} + gaji`);
}

function buyBusiness(id){
 const s=S(),b=BUSINESSES.find(x=>x.id===id);
 if(s.economy.cash<b.cost){toast("Cash kurang.");return}
 if(s.economy.businesses.some(x=>x.id===id)){toast("Sudah punya.");return}
 s.economy.cash-=b.cost;s.economy.businesses.push({...b,level:1});
 s.economy.weeklyIncome+=b.income;addLog(`Membeli ${b.name}.`);
 saveDB();render();
}
function collectBusiness(id){
 const s=S(),b=s.economy.businesses.find(x=>x.id===id);
 if(!b)return;
 let amount=b.income*b.level;
 if(chance(b.risk)){amount=Math.round(amount*.35);toast("Business kena bad event.");}
 s.economy.cash+=amount;advanceDay(7);addLog(`Business income ${b.name}: ${money(amount)}.`);
 saveDB();render();
}
function bankDeposit(amount){
 const s=S();if(s.economy.cash<amount){toast("Cash kurang.");return}
 s.economy.cash-=amount;s.economy.bank+=amount;saveDB();render();
}
function bankWithdraw(amount){
 const s=S();if(s.economy.bank<amount){toast("Saldo bank kurang.");return}
 s.economy.bank-=amount;s.economy.cash+=amount;saveDB();render();
}

function gacha(n){
 const s=S(),cost=n===10?9000:1000*n;
 if(s.economy.cash<cost){toast("Cash tidak cukup.");return}
 s.economy.cash-=cost;
 const results=[];
 for(let z=0;z<n;z++){
  const p=rollPartner();
  const owned=s.partners.find(x=>x.id===p.id);
  if(owned){
   owned.affection=clamp(owned.affection+8,0,100);
   owned.trust=clamp(owned.trust+2,0,100);
   results.push(`${p.rarity} ${p.name} DUP +affection`);
  }else{
   const copy=JSON.parse(JSON.stringify(p));
   copy.affection=10+Math.floor(Math.random()*10);
   s.partners.push(copy);results.push(`${p.rarity} ${p.name}`);
  }
 }
 addLog(`Gacha ${n}x: ${results.join(", ")}`);
 saveDB();
 modal=`<div class="modalwrap"><div class="modal">
  <div class="between"><h2>Gacha Results</h2><button class="btn" onclick="modal=null;render()">Close</button></div>
  ${results.map(x=>`<div class="item" style="margin-top:8px">${esc(x)}</div>`).join("")}
 </div></div>`;
 render();
}
function rollPartner(){
 let total=RARITIES.reduce((a,b)=>a+b.weight,0),r=Math.random()*total,rar="B";
 for(const x of RARITIES){r-=x.weight;if(r<=0){rar=x.id;break}}
 return pick(PARTNERS.filter(p=>p.rarity===rar));
}

function partnerAction(id,type){
 const s=S(),p=s.partners.find(x=>x.id===id);if(!p)return;
 if(type==="chat"){
  p.affection=clamp(p.affection+(chance(75)?3:-1),0,100);p.trust=clamp(p.trust+1,0,100);
  p.arc++;addLog(`Chat dengan ${p.name}.`);
 }else if(type==="date"){
  if(s.economy.cash<500){toast("Date butuh $500.");return}
  s.economy.cash-=500;p.affection=clamp(p.affection+8,0,100);p.happiness=clamp(p.happiness+7,0,100);
  p.jealousy=clamp(p.jealousy-2,0,100);p.arc++;addLog(`Date bersama ${p.name}.`);
 }else if(type==="support"){
  p.trust=clamp(p.trust+7,0,100);p.affection=clamp(p.affection+5,0,100);
  s.stats.fame+=1;addLog(`Mendukung karier ${p.name}.`);
 }else if(type==="argue"){
  p.affection=clamp(p.affection-8,0,100);p.trust=clamp(p.trust-5,0,100);p.jealousy=clamp(p.jealousy+10,0,100);

 p.status=p.married?"married":p.affection>=50?"dating":"single";
 saveDB();openPartner(id);
}

function advanceTime(){
 const s=S();
 advanceDay(1);
 s.football.energy=clamp(s.football.energy+12,0,100);
 const income=s.economy.businesses.reduce((a,b)=>a+b.income*b.level,0);
 if(chance(40)&&income>0)s.economy.cash+=Math.round(income/7);
 if(chance(18))randomNews();
 if(chance(10)&&s.partners.length){
  const p=pick(s.partners);
  if(p.jealousy>60){p.affection=clamp(p.affection-2,0,100);addLog(`${p.name} merasa sedikit cemburu.`)}
 }
 checkAchievements();saveDB();render();
}
